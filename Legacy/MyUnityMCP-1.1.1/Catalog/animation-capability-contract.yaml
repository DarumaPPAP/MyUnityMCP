schema_version: "1.0"
module: unity_animation_mcp
status: editor_operational

principles:
  progressive_disclosure: true
  explicit_activation_required: true
  unavailable_is_not_passed: true
  capture_is_not_visual_acceptance: true
  compile_is_not_runtime_acceptance: true
  no_silent_fallback: true

capabilities:
  animation:
    mode: editor_domain
    use_when:
      - inspect or validate AnimatorController parameter state
      - prepare or apply an explicitly approved AnimatorController parameter mutation
    requires:
      - explicit_tool_activation
      - exact_animator_controller_target
      - expected_revision_for_mutation
      - prepared_one_time_plan_for_mutation
      - approval_token_for_mutation
    must_not:
      - rewrite_state_machines
      - rewrite_transitions
      - rewrite_animation_curves
      - mutate_clip_events
      - automatically_save
      - mutate_outside_parameter_scope
    success_evidence:
      - animator_controller_identity
      - validation_result
      - exact_parameter_diff_when_mutating
      - revision_and_plan_consumption_result_when_mutating
