schema_version: "2.5"
release_version: "1.1.1"
capability_contracts: Catalog/capability-contracts.yaml
production_evidence: Tests/Compatibility/production-editor-acceptance.yaml
production_surface_contract: Catalog/production-surface-contract.yaml

modules:
  unity_graphics_mcp:
    kind: domain
    status: editor_operational
    manifest: Packages/com.darumappap.my-unity-mcp/MCP_MANIFEST.yaml
    specification: Specs/UnityGraphicsMCP/spec.md
    capability_contract: Catalog/capability-contracts.yaml
    default_tool_group: inspect
    available_tool_groups:
      - inspect
      - plan
      - mutate
      - save
      - bake
      - capture
      - evaluate
      - review_and_refine
      - execution

  unity_agent_mcp:
    kind: control_plane
    status: editor_operational
    manifest: Packages/com.darumappap.my-unity-mcp/MCP_MANIFEST.yaml
    runtime_catalog: Packages/com.darumappap.my-unity-mcp/Editor/Operational/Agent/UnityAgentMcpCatalog.json
    capability_contract: Catalog/unity-agent-capability-contracts.yaml
    default_tool_group: agent
    available_tool_groups:
      - agent
    direct_unity_mutation_allowed: false

  world_creator:
    kind: creator
    status: editor_operational
    manifest: Packages/com.darumappap.my-unity-mcp/MCP_MANIFEST.yaml
    specification: Specs/UnityWorldCreatorMCP/spec.md
    capability_contract: Catalog/world-creator-capability-contract.yaml
    default_tool_group: creator
    available_tool_groups:
      - creator
    direct_unity_mutation_allowed: false
    orchestration_control_plane: unity_agent_mcp
    operational_delegate_domains:
      - unity_graphics_mcp

  unity_profiler_mcp:
    kind: domain
    status: editor_operational
    capability_contract: Catalog/profiler-capability-contract.yaml
    default_tool_group: profiler
    available_tool_groups:
      - profiler
    tools: 8

  unity_addressables_mcp:
    kind: optional_domain
    status: editor_operational
    capability_contract: Catalog/addressables-capability-contract.yaml
    default_tool_group: addressables
    available_tool_groups:
      - addressables
    tools: 4
    required_package: com.unity.addressables
    package_absent_result: UNSUPPORTED
    content_build: excluded_from_current_mcp_surface

  unity_ui_mcp:
    kind: domain
    status: editor_operational
    capability_contract: Catalog/ui-capability-contract.yaml
    default_tool_group: ui
    available_tool_groups:
      - ui
    tools: 5

  unity_animation_mcp:
    kind: domain
    status: editor_operational
    capability_contract: Catalog/animation-capability-contract.yaml
    default_tool_group: animation
    available_tool_groups:
      - animation
    tools: 5

  unity_audio_mcp:
    kind: domain
    status: editor_operational
    capability_contract: Catalog/audio-capability-contract.yaml
    default_tool_group: audio
    available_tool_groups:
      - audio
    tools: 5

  unity_cinematic_mcp:
    kind: domain
    status: editor_operational
    capability_contract: Catalog/cinematic-capability-contract.yaml
    default_tool_group: cinematic
    available_tool_groups:
      - cinematic
    tools: 5

selection:
  load_all_tool_schemas: false
  load_package_source_by_default: false
  explicit_tool_activation_required: true
  capability_contract_required_for_operational_module: true
  load_only_selected_capability_contract: true

production_policy:
  production_verified_tool_count: 77
  previous_verified_baseline_tool_count: 45
  exact_tool_surface: 77
  direct_editor_validation: passed
  direct_editor_evidence: Tests/Compatibility/production-editor-acceptance.yaml
  automated_ci: unavailable_not_verified
  automated_ci_required_for_release: false
  human_release_gate: satisfied_by_explicit_release_request
  target_device_validation: not_verified_not_required_for_editor_only_release
