schema_version: "1.0"
module: unity_audio_mcp
status: editor_operational

principles:
  progressive_disclosure: true
  explicit_activation_required: true
  unavailable_is_not_passed: true
  capture_is_not_visual_acceptance: true
  compile_is_not_runtime_acceptance: true
  no_silent_fallback: true

capabilities:
  audio:
    mode: editor_domain
    use_when:
      - inspect or validate AudioSource state in the current Unity scene
      - prepare or apply an explicitly approved AudioSource property mutation
    requires:
      - explicit_tool_activation
      - exact_audio_source_target
      - expected_revision_for_mutation
      - prepared_one_time_plan_for_mutation
      - approval_token_for_mutation
    must_not:
      - replace_audio_clip
      - create_audio_mixer_assets
      - automatically_save
      - mutate_outside_supported_audio_source_properties
      - reinterpret_missing_target_as_success
    success_evidence:
      - audio_source_identity
      - validation_result
      - exact_before_after_supported_property_values_when_mutating
      - revision_and_plan_consumption_result_when_mutating
