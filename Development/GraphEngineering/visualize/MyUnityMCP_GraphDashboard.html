<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyUnityMCP Graph Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#0d1118;--card:#151b24;--text:#eef3f8;--muted:#93a0b2;--border:#2b3544;--accent:#70a5ff;--ok:#46d69a;--run:#ffbf69;--approval:#b996ff;--danger:#ff7474}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Yu Gothic UI",sans-serif}.shell{max-width:1180px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.head h1{font-size:22px;margin:0 0 6px}.head p,.muted{color:var(--muted)}.tabs{display:flex;gap:8px}.tab,.node{border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}.tab{padding:10px 13px;border-radius:11px}.tab.active,.node.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(112,165,255,.25)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.metric{padding:14px;border:1px solid var(--border);border-radius:14px;background:#111720}.metric span{color:var(--muted);font-size:12px}.metric b{display:block;font-size:22px;margin-top:5px}.controls{display:grid;grid-template-columns:1fr 220px;gap:10px;margin-bottom:14px}.control{display:grid;gap:6px;font-size:12px;color:var(--muted)}input,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text)}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}.graph,.detail{border:1px solid var(--border);border-radius:16px;background:var(--panel)}.graph{padding:16px;max-height:72vh;overflow:auto}.detail{padding:18px;height:max-content;position:sticky;top:14px}.node{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:11px;width:100%;padding:12px;margin-bottom:9px;border-radius:12px;text-align:left}.node.hidden{display:none}.dot{width:11px;height:11px;border-radius:50%;background:var(--border)}.status-complete .dot{background:var(--ok)}.status-running .dot{background:var(--run)}.status-eligible .dot{background:var(--accent)}.status-approval .dot{background:var(--approval)}.status-blocked .dot{background:var(--danger)}.node small,.state{color:var(--muted)}.badge{display:inline-block;padding:4px 9px;border:1px solid var(--accent);border-radius:999px;font-size:11px}.detail section{margin-top:18px}.detail h2{font-size:18px;margin:8px 0}.detail p,.detail li{font-size:13px;line-height:1.65;overflow-wrap:anywhere}.gate{padding:12px;border:1px solid var(--accent);border-radius:12px;background:rgba(112,165,255,.08)}@media(max-width:800px){.head{display:block}.tabs{margin-top:14px;flex-wrap:wrap}.metrics{grid-template-columns:repeat(2,1fr)}.controls,.workspace{grid-template-columns:1fr}.detail{position:static;order:-1}}
</style>
</head>
<body>
<main class="shell">
<section class="head">
<div><h1>MyUnityMCP Graph Dashboard</h1><p>GitHub上で直接確認できるStatic Snapshotです。実行StateはBranch更新時点の値です。</p></div>
<div class="tabs" aria-label="Graph切替">
<button id="implementationTab" class="tab active" type="button">Codex実装グラフ</button>
<button id="runtimeTab" class="tab" type="button">製品Runtimeグラフ</button>
</div>
</section>
<section class="metrics">
<article class="metric"><span>全Node</span><b id="totalMetric">—</b></article>
<article class="metric"><span>完了</span><b id="completeMetric">—</b></article>
<article class="metric"><span>実行可能／実行中</span><b id="activeMetric">—</b></article>
<article class="metric"><span>Terminal Goal</span><b id="terminalMetric">未達成</b></article>
</section>
<section class="controls">
<label class="control"><span>Node検索</span><input id="searchInput" type="search" placeholder="例: Profiler / Creator / Approval"></label>
<label class="control"><span>表示状態</span><select id="statusFilter"><option value="all">すべて</option><option value="complete">完了</option><option value="running">実行中</option><option value="eligible">実行可能</option><option value="pending">未着手</option><option value="approval">Human Gate</option><option value="blocked">Blocked</option></select></label>
</section>
<section class="workspace">
<div id="graph" class="graph"></div>
<aside class="detail">
<span class="muted">選択中Node</span><h2 id="detailTitle">—</h2><span id="detailStatus" class="badge">—</span>
<section><span class="muted">役割</span><p id="detailDescription">—</p></section>
<section><span class="muted">依存Node</span><p id="detailDependencies">—</p></section>
<section><span class="muted">必須Evidence</span><ul id="detailEvidence"></ul></section>
<section><span class="muted">State</span><p id="detailState">—</p></section>
<section class="gate"><strong>次の遷移条件</strong><p id="detailGate">—</p></section>
</aside>
</section>
</main>
<script>
window.__MYUNITYMCP_STATIC_SNAPSHOTS__={
implementation:{graph_id:"myunitymcp_codex_implementation",terminal_node:"project_complete",state:{project_status:"running",current_node:"phase_01_unity_agent_runtime",terminal_goal_satisfied:false,updated_at:"2026-08-07T03:32:00+09:00"},nodes:[
{id:"bootstrap_development_harness",title:"Harness Bootstrap",subtitle:"開発Harness構築",status:"complete",depends:[],evidence:["harness_validation","state_validation","completion_gate_negative_test"],description:"Graph、State、Evidence検証をRepositoryへ導入します。",gate:"Harness validation、State validation、Completion Gate negative testが成功すること。"},
{id:"phase_00_release_integrity",title:"Phase 0",subtitle:"Release Integrity",status:"complete",depends:["bootstrap_development_harness"],evidence:["release_policy","release_integrity_tests","current_release_resolution"],description:"公開済みTagを不変に保つRelease identityを確立します。",gate:"Release Policyと現在Releaseの扱いが一致すること。"},
{id:"phase_01_unity_agent_runtime",title:"Phase 1",subtitle:"UnityAgentMCP Runtime",status:"running",depends:["phase_00_release_integrity"],evidence:["agent_runtime_tests","graphics_delegation_e2e","safety_regression"],description:"Domain MCPを統括するControl Planeを実装・検証します。",gate:"Python Preflight、Unity Compile、GraphicsMCP委譲E2E、安全性回帰が成功すること。"},
{id:"phase_02_world_creator",title:"Phase 2",subtitle:"WorldCreator Runtime",status:"pending",depends:["phase_01_unity_agent_runtime"],evidence:["world_creator_e2e","human_review_handoff","creator_no_direct_mutation"],description:"Visual Goalを統合実行Planへ変換します。",gate:"Creatorが直接MutationせずHuman Reviewへ到達すること。"},
{id:"phase_03_profiler_mcp",title:"Phase 3",subtitle:"ProfilerMCP",status:"pending",depends:["phase_02_world_creator"],evidence:["profiler_capture_tests","baseline_compare","no_false_device_claim"],description:"Editor計測、Baseline比較、環境Evidenceを提供します。",gate:"再現可能なCaptureと正確な環境表記があること。"},
{id:"phase_04_build_mcp",title:"Phase 4",subtitle:"BuildMCP",status:"pending",depends:["phase_03_profiler_mcp"],evidence:["build_plan_tests","build_report_evidence","secret_redaction"],description:"Build PlanとBuild Evidenceを扱います。",gate:"BuildReport、Artifact Hash、Secret Redactionが検証されること。"},
{id:"phase_05_addressables_mcp",title:"Phase 5",subtitle:"AddressablesMCP",status:"pending",depends:["phase_04_build_mcp"],evidence:["package_gate_tests","addressables_mutation_tests","content_build_evidence"],description:"Addressables検査、Typed Mutation、Content Buildを扱います。",gate:"Package GateとContent Build Evidenceが揃うこと。"},
{id:"phase_06_ui_mcp",title:"Phase 6",subtitle:"UIMCP",status:"pending",depends:["phase_05_addressables_mcp"],evidence:["ui_backend_tests","layout_validation","visual_review_handoff"],description:"uGUI／UI ToolkitをTyped Planで検査・変更します。",gate:"Backend E2EとVisual Review handoffがあること。"},
{id:"phase_07_animation_mcp",title:"Phase 7",subtitle:"AnimationMCP",status:"pending",depends:["phase_06_ui_mcp"],evidence:["animator_graph_tests","typed_mutation_tests","undo_revision_tests"],description:"Animator Graphを検査・変更・Undoします。",gate:"Typed MutationとRevision安全性が検証されること。"},
{id:"phase_08_audio_mcp",title:"Phase 8",subtitle:"AudioMCP",status:"pending",depends:["phase_07_animation_mcp"],evidence:["audio_scene_tests","routing_mutation_tests","unsupported_topology_test"],description:"Audio構成と既存Mixer routingを扱います。",gate:"非対応Topologyを成功扱いせず拒否すること。"},
{id:"phase_09_cinematic_mcp",title:"Phase 9",subtitle:"CinematicMCP",status:"pending",depends:["phase_08_audio_mcp"],evidence:["package_version_gates","timeline_cinemachine_e2e","binding_validation"],description:"Timeline／Cinemachine／Animation／Audioを統合します。",gate:"Package GateとShot Sequence E2Eが成功すること。"},
{id:"phase_10_movie_creator",title:"Phase 10",subtitle:"MovieCreator",status:"pending",depends:["phase_09_cinematic_mcp"],evidence:["movie_creator_e2e","continuity_review","human_visual_handoff"],description:"Narrative GoalからMovie Sequenceを統合します。",gate:"Continuity ReviewとHuman Visual Reviewへ到達すること。"},
{id:"phase_11_live_creator",title:"Phase 11",subtitle:"LiveCreator",status:"pending",depends:["phase_10_movie_creator"],evidence:["live_creator_e2e","timing_validation","character_visibility_review"],description:"Cue／TimecodeからLive Sequenceを統合します。",gate:"TimingとCharacter Visibilityが検証されること。"},
{id:"phase_12_production_hardening",title:"Phase 12",subtitle:"Production Hardening",status:"pending",depends:["phase_11_live_creator"],evidence:["compatibility_matrix","external_client_e2e","security_modes","release_candidate"],description:"互換性、Security、Failure Recoveryを完成させます。",gate:"Release CandidateとProduction Evidenceが揃うこと。"},
{id:"project_completion_gate",title:"Completion Gate",subtitle:"全Phase統合検証",status:"pending",depends:["phase_12_production_hardening"],evidence:["all_phase_evidence_valid","graphics_regression","catalog_manifest_docs_consistency","no_critical_safety_issue","release_candidate"],description:"全PhaseとEvidenceを機械判定します。",gate:"全必須EvidenceがありCritical Safety Issueがないこと。"},
{id:"human_final_release_approval",title:"Human Approval",subtitle:"最終Release承認",status:"approval",depends:["project_completion_gate"],evidence:["human_release_approval"],description:"人間がRelease Candidateを最終確認します。",gate:"明示的な最終承認が記録されること。"},
{id:"project_complete",title:"Project Complete",subtitle:"Terminal Goal達成",status:"pending",depends:["human_final_release_approval"],evidence:[],description:"唯一のProject Terminal Nodeです。",gate:"Human Final Release Approvalからのみ遷移します。"}
]},
runtime:{graph_id:"myunitymcp_product_runtime",terminal_node:"execution_complete",state:{project_status:"target_architecture",current_node:null,terminal_goal_satisfied:false,updated_at:"static"},nodes:[
{id:"normalize_intent",title:"意図を正規化",subtitle:"model_or_deterministic",status:"eligible",depends:[],evidence:["normalized_goal"],description:"MCP Clientから受け取ったGoalを共通形式へ正規化します。",gate:"Goal、Scope、禁止変更、Acceptanceが明示されること。"},
{id:"inspect_capabilities",title:"Capability検査",subtitle:"code",status:"pending",depends:["normalize_intent"],evidence:["capability_snapshot"],description:"Catalog、Package、Project環境から利用可能な能力を確定します。",gate:"未導入Packageや未検証Backendを成功扱いしないこと。"},
{id:"select_domains",title:"Domain選択",subtitle:"model_with_policy",status:"pending",depends:["inspect_capabilities"],evidence:["selected_domains"],description:"Goalに必要なDomain MCP／Creatorだけを選択します。",gate:"不要なDomainを起動せず最小Scopeを維持すること。"},
{id:"activate_tool_groups",title:"Tool Group有効化",subtitle:"code_gate",status:"pending",depends:["select_domains"],evidence:["activated_tool_groups"],description:"既定無効のTool GroupをPolicyに従って有効化します。",gate:"AllowlistとSecurity Modeに一致すること。"},
{id:"inspect",title:"Inspect",subtitle:"domain_tools",status:"pending",depends:["activate_tool_groups"],evidence:["domain_findings"],description:"変更前のProject／Scene／Asset状態を読み取り専用で検査します。",gate:"MutationなしでBaselineを確定すること。"},
{id:"compile_integrated_plan",title:"統合Plan生成",subtitle:"model_and_code",status:"pending",depends:["inspect"],evidence:["integrated_plan"],description:"Domain Planを依存関係付きの統合実行Planへコンパイルします。",gate:"Exact Diff、Risk、Revisionが明示されること。"},
{id:"human_approval",title:"人間承認",subtitle:"human_gate",status:"approval",depends:["compile_integrated_plan"],evidence:["approval_token"],description:"Mutation前にScope、差分、Riskを人間が承認します。",gate:"ScopeとRevisionに紐づくApproval Tokenがあること。"},
{id:"apply_domain_plans",title:"Domain Apply",subtitle:"domain_tools",status:"pending",depends:["human_approval"],evidence:["apply_results"],description:"承認済みPlanをDomain MCPへ委譲して適用します。",gate:"Control PlaneやCreatorがUnity APIを直接変更しないこと。"},
{id:"save_bake_build",title:"Save / Bake / Build",subtitle:"separate_approval_gates",status:"pending",depends:["apply_domain_plans"],evidence:["side_effect_results"],description:"Save、Bake、Buildを独立承認境界で処理します。",gate:"各Side Effectに個別承認があること。"},
{id:"collect_evidence",title:"Evidence収集",subtitle:"code",status:"pending",depends:["save_bake_build"],evidence:["execution_evidence"],description:"結果、Test、Capture、Profile、Revisionを構造化Evidenceへ集約します。",gate:"EvidenceがSource Revisionへ追跡可能であること。"},
{id:"machine_evaluation",title:"機械評価",subtitle:"code_gate",status:"pending",depends:["collect_evidence"],evidence:["machine_evaluation"],description:"Schema、Test、技術的Acceptanceを機械判定します。",gate:"必須Evidence欠落時に完了しないこと。"},
{id:"human_review",title:"人間レビュー",subtitle:"human_gate",status:"approval",depends:["machine_evaluation"],evidence:["human_review"],description:"Visual、Audio、Cinematic品質を人間がレビューします。",gate:"自動でBeauty Passを宣言しないこと。"},
{id:"refine",title:"Refine Loop",subtitle:"loop",status:"pending",depends:["human_review"],evidence:["refinement_decision"],description:"Review結果を次のPlanへ戻し必要な修正だけを反復します。",gate:"同じ失敗を無制限に繰り返さないこと。"},
{id:"execution_complete",title:"Execution Complete",subtitle:"terminal",status:"pending",depends:["refine"],evidence:["accepted_execution"],description:"実行単位のAcceptanceとEvidenceが成立した終端です。",gate:"Machine Acceptanceと必要なHuman Reviewが成立すること。"}
]}}
};
const snapshots=window.__MYUNITYMCP_STATIC_SNAPSHOTS__;
const labels={complete:"完了",running:"実行中",eligible:"実行可能",pending:"未着手",approval:"Human Gate",blocked:"Blocked"};
let mode="implementation",selected=null;
const graph=document.getElementById("graph"),search=document.getElementById("searchInput"),filter=document.getElementById("statusFilter");
function current(){return snapshots[mode]}
function render(){const snap=current(),q=search.value.trim().toLowerCase(),f=filter.value;graph.replaceChildren();let complete=0,active=0;for(const n of snap.nodes){if(n.status==="complete")complete++;if(n.status==="running"||n.status==="eligible")active++;const text=`${n.id} ${n.title} ${n.subtitle} ${n.description}`.toLowerCase();if((q&&!text.includes(q))||(f!=="all"&&n.status!==f))continue;const b=document.createElement("button");b.type="button";b.className=`node status-${n.status}${selected===n.id?" active":""}`;b.innerHTML=`<i class="dot"></i><span><b>${n.title}</b><br><small>${n.subtitle}<br>${n.id}</small></span><span class="state">${labels[n.status]||n.status}</span>`;b.onclick=()=>{selected=n.id;render();show(n)};graph.appendChild(b)}document.getElementById("totalMetric").textContent=snap.nodes.length;document.getElementById("completeMetric").textContent=complete;document.getElementById("activeMetric").textContent=active;document.getElementById("terminalMetric").textContent=snap.state.terminal_goal_satisfied?"達成":"未達成";if(!selected||!snap.nodes.some(n=>n.id===selected)){selected=snap.nodes[0].id;show(snap.nodes[0])}}
function show(n){document.getElementById("detailTitle").textContent=`${n.title} — ${n.subtitle}`;document.getElementById("detailStatus").textContent=labels[n.status]||n.status;document.getElementById("detailDescription").textContent=n.description;document.getElementById("detailDependencies").textContent=n.depends.length?n.depends.join(" / "):"なし";document.getElementById("detailEvidence").innerHTML=n.evidence.length?n.evidence.map(x=>`<li>${x}</li>`).join(""):"<li>追加Evidenceなし</li>";const s=current().state;document.getElementById("detailState").textContent=`Project: ${s.project_status} / Current: ${s.current_node||"—"} / 更新: ${s.updated_at}`;document.getElementById("detailGate").textContent=n.gate}
function switchMode(next){mode=next;selected=null;document.getElementById("implementationTab").classList.toggle("active",next==="implementation");document.getElementById("runtimeTab").classList.toggle("active",next==="runtime");render()}
document.getElementById("implementationTab").onclick=()=>switchMode("implementation");document.getElementById("runtimeTab").onclick=()=>switchMode("runtime");search.oninput=render;filter.onchange=render;render();
</script>
</body>
</html>
