<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyUnityMCP Graph Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#0d1118;--card:#151b24;--text:#eef3f8;--muted:#93a0b2;--border:#2b3544;--accent:#70a5ff;--ok:#46d69a;--approval:#b996ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Yu Gothic UI",sans-serif}.shell{padding:20px;max-width:1100px;margin:auto}.head{display:flex;justify-content:space-between;gap:16px;align-items:center}.head h1{font-size:20px;margin:0}.head p{color:var(--muted);font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0}.metric{padding:14px;border:1px solid var(--border);border-radius:14px;background:#111720}.metric span{color:var(--muted);font-size:12px}.metric b{display:block;font-size:22px;margin-top:6px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.graph,.detail{border:1px solid var(--border);border-radius:16px;background:var(--panel)}.graph{padding:18px}.detail{padding:17px;height:max-content}.node{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:10px;width:100%;margin:0 0 9px;padding:12px;border:1px solid var(--border);border-radius:13px;background:var(--card);color:var(--text);text-align:left;cursor:pointer}.node:hover,.node.active{border-color:var(--accent)}.dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--border)}.eligible .dot{background:var(--accent)}.approval .dot{background:var(--approval)}.node small,.muted{color:var(--muted)}.status{font-size:11px}.detail h2{font-size:17px}.badge{display:inline-block;padding:4px 8px;border:1px solid var(--accent);border-radius:999px;background:rgba(112,165,255,.14);font-size:11px}.detail section{margin-top:18px}.detail li{font-size:12px;margin:7px 0;overflow-wrap:anywhere}.gate{padding:12px;border:1px solid var(--accent);border-radius:12px;background:rgba(112,165,255,.08);font-size:12px}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}.detail{order:-1}}
</style>
</head>
<body><main class="shell">
<section class="head"><div><h1>MyUnityMCP 実装グラフ</h1><p>GitHub上で確認するStatic Snapshot。実行中StateはLive Viewerを使用します。</p></div></section>
<section class="metrics"><article class="metric"><span>全Node</span><b>17</b></article><article class="metric"><span>完了</span><b>0</b></article><article class="metric"><span>実行可能</span><b>1</b></article><article class="metric"><span>Terminal Goal</span><b style="font-size:16px">未達成</b></article></section>
<section class="workspace"><div id="graph" class="graph"></div><aside class="detail"><span class="muted">選択中Node</span><h2 id="title"></h2><span id="status" class="badge"></span><section><span class="muted">役割</span><p id="description"></p></section><section><span class="muted">依存Node</span><p id="deps"></p></section><section><span class="muted">必須Evidence</span><ul id="evidence"></ul></section><section class="gate"><strong>次の遷移条件</strong><p id="gate"></p></section></aside></section>
</main>
<script>
const nodes=[
{id:'bootstrap_development_harness',title:'Harness Bootstrap',sub:'開発Harness構築',status:'eligible',deps:[],ev:['harness_validation','state_validation','completion_gate_negative_test'],desc:'Graph、State、Evidence検証をRepositoryへ導入します。',gate:'Harness、State、Completion Gate negative testが成功すること。'},
{id:'phase_00_release_integrity',title:'Phase 0',sub:'Release Integrity',status:'pending',deps:['Harness Bootstrap'],ev:['release_policy','release_integrity_tests','current_release_resolution'],desc:'Release identityとImmutable Release Policyを確立します。',gate:'Release整合性Testと現在Releaseの扱いが確定すること。'},
{id:'phase_01_unity_agent_runtime',title:'Phase 1',sub:'UnityAgentMCP Runtime',status:'pending',deps:['Phase 0'],ev:['agent_runtime_tests','graphics_delegation_e2e','safety_regression'],desc:'Domain MCPを統括するControl Planeを実装します。',gate:'GraphicsMCP委譲E2EとSafety回帰が成功すること。'},
{id:'phase_02_world_creator',title:'Phase 2',sub:'WorldCreator Runtime',status:'pending',deps:['Phase 1'],ev:['world_creator_e2e','human_review_handoff','creator_no_direct_mutation'],desc:'Visual Goalを統合実行Planへ変換します。',gate:'直接MutationせずHuman Reviewへ到達すること。'},
{id:'phase_03_profiler_mcp',title:'Phase 3',sub:'ProfilerMCP',status:'pending',deps:['Phase 2'],ev:['profiler_capture_tests','baseline_compare','no_false_device_claim'],desc:'Editor計測、Baseline比較、Evidenceを提供します。',gate:'再現可能なCaptureと正確な環境表記があること。'},
{id:'phase_04_build_mcp',title:'Phase 4',sub:'BuildMCP',status:'pending',deps:['Phase 3'],ev:['build_plan_tests','build_report_evidence','secret_redaction'],desc:'Build PlanとBuild Evidenceを扱います。',gate:'BuildReport、Artifact Hash、Secret Redactionが検証されること。'},
{id:'phase_05_addressables_mcp',title:'Phase 5',sub:'AddressablesMCP',status:'pending',deps:['Phase 4'],ev:['package_gate_tests','addressables_mutation_tests','content_build_evidence'],desc:'Addressables検査、Typed Mutation、Content Buildを扱います。',gate:'Package GateとContent Build Evidenceが揃うこと。'},
{id:'phase_06_ui_mcp',title:'Phase 6',sub:'UIMCP',status:'pending',deps:['Phase 5'],ev:['ui_backend_tests','layout_validation','visual_review_handoff'],desc:'uGUI／UI ToolkitをTyped Planで検査・変更します。',gate:'Backend E2EとVisual Review handoffがあること。'},
{id:'phase_07_animation_mcp',title:'Phase 7',sub:'AnimationMCP',status:'pending',deps:['Phase 6'],ev:['animator_graph_tests','typed_mutation_tests','undo_revision_tests'],desc:'Animator Graphを検査・変更・Undoします。',gate:'Typed MutationとRevision安全性が検証されること。'},
{id:'phase_08_audio_mcp',title:'Phase 8',sub:'AudioMCP',status:'pending',deps:['Phase 7'],ev:['audio_scene_tests','routing_mutation_tests','unsupported_topology_test'],desc:'Audio構成と既存Mixer routingを扱います。',gate:'非対応Topologyを正しく拒否すること。'},
{id:'phase_09_cinematic_mcp',title:'Phase 9',sub:'CinematicMCP',status:'pending',deps:['Phase 8'],ev:['package_version_gates','timeline_cinemachine_e2e','binding_validation'],desc:'Timeline／Cinemachine／Animation／Audioを統合します。',gate:'Package GateとShot Sequence E2Eが成功すること。'},
{id:'phase_10_movie_creator',title:'Phase 10',sub:'MovieCreator',status:'pending',deps:['Phase 9'],ev:['movie_creator_e2e','continuity_review','human_visual_handoff'],desc:'Narrative GoalからMovie Sequenceを統合します。',gate:'Continuity ReviewとHuman Visual Reviewへ到達すること。'},
{id:'phase_11_live_creator',title:'Phase 11',sub:'LiveCreator',status:'pending',deps:['Phase 10'],ev:['live_creator_e2e','timing_validation','character_visibility_review'],desc:'Cue／TimecodeからLive Sequenceを統合します。',gate:'TimingとCharacter Visibilityが検証されること。'},
{id:'phase_12_production_hardening',title:'Phase 12',sub:'Production Hardening',status:'pending',deps:['Phase 11'],ev:['compatibility_matrix','external_client_e2e','security_modes','release_candidate'],desc:'互換性、Security、Failure Recoveryを完成させます。',gate:'Release CandidateとProduction Evidenceが揃うこと。'},
{id:'project_completion_gate',title:'Completion Gate',sub:'全Phase統合検証',status:'pending',deps:['Phase 0〜12'],ev:['all_phase_evidence_valid','graphics_regression','catalog_manifest_docs_consistency','no_critical_safety_issue','release_candidate'],desc:'全PhaseとEvidenceを機械判定します。',gate:'全必須EvidenceがありCritical Safety Issueがないこと。'},
{id:'human_final_release_approval',title:'Human Approval',sub:'最終Release承認',status:'approval',deps:['Completion Gate'],ev:['human_release_approval'],desc:'人間がRelease Candidateを最終確認します。',gate:'明示的な最終承認が記録されること。'},
{id:'project_complete',title:'Project Complete',sub:'Terminal Goal達成',status:'pending',deps:['Human Approval'],ev:[],desc:'唯一のProject Terminal Nodeです。',gate:'Human Final Release Approvalからのみ遷移します。'}];
const graph=document.getElementById('graph');
function select(n,b){document.querySelectorAll('.node').forEach(x=>x.classList.remove('active'));b.classList.add('active');title.textContent=n.title+' — '+n.sub;status.textContent=n.status==='eligible'?'実行可能':n.status==='approval'?'Human Gate':'未着手';description.textContent=n.desc;deps.textContent=n.deps.length?n.deps.join(' / '):'なし';evidence.innerHTML=n.ev.map(x=>'<li>○ '+x+'</li>').join('')||'<li>追加Evidenceなし</li>';gate.textContent=n.gate}
nodes.forEach((n,i)=>{const b=document.createElement('button');b.className='node '+n.status;b.innerHTML='<i class="dot"></i><span><b>'+n.title+'</b><br><small>'+n.sub+'</small></span><span class="status">'+(n.status==='eligible'?'実行可能':n.status==='approval'?'Human Gate':'未着手')+'</span>';b.addEventListener('click',()=>select(n,b));graph.appendChild(b);if(i===0)select(n,b)});
</script></body></html>
