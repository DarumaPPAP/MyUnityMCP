schema_version: "1.1"
states:
  allowed:
    - design_only
    - development_candidate
    - editor_compiled
    - contract_verified
    - integration_verified
    - release_candidate
    - operational

promotion_states:
  allowed:
    - blocked
    - ready
    - promoted

capabilities:
  unity_agent_mcp: { state: operational, promotion: promoted }
  unity_profiler_mcp: { state: release_candidate, promotion: ready }
  unity_build_mcp: { state: release_candidate, promotion: ready }
  unity_addressables_mcp: { state: release_candidate, promotion: ready }
  unity_ui_mcp: { state: release_candidate, promotion: ready }
  unity_animation_mcp: { state: release_candidate, promotion: ready }
  unity_audio_mcp: { state: release_candidate, promotion: ready }
  unity_cinematic_mcp: { state: release_candidate, promotion: ready }
  world_creator: { state: release_candidate, promotion: ready }
  movie_creator: { state: release_candidate, promotion: ready }
  live_creator: { state: release_candidate, promotion: ready }

accounting:
  production_tools: 42
  remaining_development_tools: 49
  final_combined_target: 91

promotion_rule:
  wholesale_graph_to_main: prohibited
  delivery_branch_from_latest_main: required
  human_approval_before_main_merge: required
