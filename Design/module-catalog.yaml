  unity_animation_mcp:
    kind: domain
    status: historical_design
    current_status: editor_operational
    operational_catalog: Catalog/mcp-catalog.yaml
    capability_contract: Catalog/animation-capability-contract.yaml

  unity_audio_mcp:
    kind: domain
    status: historical_design
    current_status: editor_operational
    operational_catalog: Catalog/mcp-catalog.yaml
    capability_contract: Catalog/audio-capability-contract.yaml

  unity_profiler_mcp:
    kind: domain
    status: historical_design
    current_status: editor_operational
    operational_catalog: Catalog/mcp-catalog.yaml
    capability_contract: Catalog/profiler-capability-contract.yaml

  unity_build_mcp:
    kind: domain
    status: historical_design
    current_status: excluded_from_current_surface
