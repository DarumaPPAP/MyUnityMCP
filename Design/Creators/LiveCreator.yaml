schema_version: "1.0"
id: live_creator
kind: workflow
status: historical_design
current_status: not_implemented_current_wave
current_status_source: Packages/com.darumappap.my-unity-mcp/Editor/Operational/Agent/UnityAgentMcpCatalog.json
blocked_by:
  - live_creator_runtime_not_implemented_current_wave

use_when:
  - live stage production
  - idol concert production
  - music synchronized lighting camera and VFX

required_inputs:
  - visual_goal_or_reference
  - stage_type
  - character_count
  - music_or_timing_source_when_available
  - unity_version
  - render_pipeline
  - target_platforms
  - prohibited_changes

required_domains:
  - unity_graphics_mcp
  - unity_cinematic_mcp

conditional_domains:
  animation_present:
    - unity_animation_mcp
  music_sync_required:
    - unity_audio_mcp
  performance_or_target_device_claim:
    - unity_profiler_mcp
  build_validation_required:
    - unity_build_mcp

workflow:
  - id: visual_intent
    owner: unity_agent
    outputs:
      - character_first_priority
      - stage_mood
      - color_script
      - camera_energy
      - disqualifiers

  - id: inspect
    owner: unity_agent_mcp
    domains:
      - unity_graphics_mcp
      - unity_cinematic_mcp
    tool_group: inspect

  - id: stage_and_look_plan
    owner: unity_graphics_mcp
    tool_group: plan
    outputs:
      - lighting_plan
      - gi_plan
      - reflection_plan
      - material_and_atmosphere_plan
      - platform_budget

  - id: camera_and_timeline_plan
    owner: unity_cinematic_mcp
    tool_group: plan
    outputs:
      - shot_plan
      - camera_language
      - timeline_plan

  - id: integrated_preview
    owner: live_creator
    outputs:
      - ordered_domain_plan
      - cross_domain_conflicts
      - approval_questions

  - id: mutation
    owner: unity_agent_mcp
    tool_group: mutate
    requires:
      - approved_integrated_plan
      - explicit_mutation_permission

  - id: bake
    owner: unity_graphics_mcp
    tool_group: bake
    requires:
      - explicit_bake_permission
      - dirty_dependency_set

  - id: capture_and_review
    owner: live_creator
    tool_group: capture
    outputs:
      - required_captures
      - technical_review
      - human_beauty_review_questions

completion:
  - character_is_not_buried_by_stage_lighting_or_vfx
  - camera_and_lighting_support_the_music_energy
  - platform_budget_is_explicit
  - visual_acceptance_requires_human_review

prohibited:
  - creator_direct_unity_api_mutation
  - automatic_save
  - automatic_full_bake
  - performance_claim_without_measurement
  - visual_acceptance_without_human_review
