name: Verification Project Rename

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rename:
    if: github.head_ref == 'refactor/semantic-feature-names' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/semantic-feature-names

      - name: Rename verification project
        run: python3 Tools/Repository/rename_verification_project.py

      - name: Commit rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No rename changes."
            exit 0
          fi
          git commit -m "refactor: rename Unity verification project by responsibility"
          git push origin HEAD:refactor/semantic-feature-names
