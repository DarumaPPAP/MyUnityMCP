name: Apply Integration Hardening Patches

on:
  pull_request:
    branches:
      - main
    paths:
      - Tools/apply-integration-hardening.py
      - .github/workflows/apply-integration-hardening.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Apply patches
        run: python3 Tools/apply-integration-hardening.py

      - name: Commit patches
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages/com.darumappap.my-unity-mcp/Editor/UnityGraphicsMcpInspection.cs
          git add Packages/com.darumappap.my-unity-mcp/Editor/UnityGraphicsMcpTools.cs
          git add Packages/com.darumappap.my-unity-mcp/Editor/UnityGraphicsMcpExecutionHardening.cs
          git add Packages/com.darumappap.my-unity-mcp/package.json
          git commit -m "feat: wire execution hardening across MCP tools"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
