name: Apply MyUnityMCP v1 Release Migration

on:
  pull_request:
    branches:
      - main
    paths:
      - .release-bootstrap/**
      - .github/workflows/apply-v1-bootstrap.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
          fetch-depth: 1

      - name: Reconstruct, apply and validate release migration
        run: |
          set -euo pipefail
          mkdir -p Tools
          cat .release-bootstrap/bootstrap0.part .release-bootstrap/bootstrap1.part > Tools/apply-v1-bootstrap.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Tools/apply-v1-bootstrap.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          marker = next(index for index, line in enumerate(lines) if line.startswith('exec(compile('))
          path.write_text(chr(10).join(lines[:marker + 1]) + chr(10), encoding='utf-8')
          PY
          python3 Tools/apply-v1-bootstrap.py

          sed -i 's/NOT_IMPLEMENTED_IN_PHASE_2/REQUIRES_SEPARATE_APPROVED_TOOL/g' Packages/com.darumappap.my-unity-mcp/Editor/UnityGraphicsMcpPlanning.cs
          sed -i 's/MyUnityMCP Environment Mutation Environment Transaction/MyUnityMCP Environment Transaction/g' Packages/com.darumappap.my-unity-mcp/Editor/UnityGraphicsMcpEnvironmentMutation.cs
          sed -i 's/- Phase: `Dependency Bake`/- Capability: `Dependency Bake`/' Specs/UnityGraphicsMCP/dependency-bake.md
          sed -i '/^  m_LightingSettings: {fileID: 0}$/d' 'Packages/com.darumappap.my-unity-mcp/Samples~/Getting Started/Scenes/MyUnityMcpGettingStarted.unity'
          sed -i '/^  m_LightingSettings: {fileID: 0}$/d' SampleProjects/MyUnityMCPGettingStarted/Assets/Scenes/MyUnityMcpGettingStarted.unity
          python3 - <<'PY'
          from pathlib import Path
          import json
          path = Path('Packages/com.darumappap.my-unity-mcp/package.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload['dependencies'].pop('com.unity.test-framework', None)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + chr(10), encoding='utf-8')
          PY

          rm -rf .release-bootstrap
          rm -f Tools/apply-v1-bootstrap.py
          rm -f Tools/apply-v1-release.py
          rm -f .github/workflows/apply-v1-bootstrap.yml
          rm -f .github/workflows/apply-v1-release.yml
          rm -f .github/workflows/release-source-audit-export.yml

          python3 Tests/Release/verify_release_contract.py --mode pr

      - name: Commit v1 release preparation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes required."
            exit 0
          fi
          git commit -m "release: prepare MyUnityMCP v1.0.0"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
