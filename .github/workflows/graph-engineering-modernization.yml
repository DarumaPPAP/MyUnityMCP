name: Graph Engineering Modernization

on:
  push:
    branches:
      - refactor/graph-engineering-modernization
  pull_request:
    branches:
      - feature/graph-engineering-master
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: graph-modernization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Canonical and Development static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run modernization static tests
        run: python3 -m unittest discover -s Development/GraphEngineering/tests -p 'test_*.py' -v
      - name: Report promotion gate without promoting
        continue-on-error: true
        run: python3 Development/GraphEngineering/scripts/verify_promotion_gate.py

  unity-editor:
    name: Unity ${{ matrix.unityVersion }} candidate contracts
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unityVersion:
          - 6000.0.75f1
          - 6000.4.12f1
          - 6000.5.5f1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - name: Free disk space
        run: |
          docker system prune --all --force || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
      - name: Run EditMode contracts
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: TestProjects/MyUnityMCPVerification
          unityVersion: ${{ matrix.unityVersion }}
          testMode: editmode
      - name: Upload Unity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-modernization-${{ matrix.unityVersion }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 30

  unity-6000-7-boundary:
    name: Unity 6000.7 evidence boundary
    needs: static
    runs-on: ubuntu-latest
    steps:
      - name: Record unavailable automated image state
        run: |
          mkdir -p evidence
          cat > evidence/unity-6000.7.json <<'JSON'
          {
            "unity_version": "6000.7",
            "automation": "UNAVAILABLE_IMAGE",
            "status": "not_verified",
            "required_evidence": "manual_editor_or_confirmed_automation"
          }
          JSON
      - uses: actions/upload-artifact@v4
        with:
          name: graph-modernization-unity-6000.7-boundary
          path: evidence/unity-6000.7.json
          retention-days: 30
