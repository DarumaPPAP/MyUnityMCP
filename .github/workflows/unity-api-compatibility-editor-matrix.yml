name: UnityArtistCLI Compatibility Matrix

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Packages/com.darumappap.unity-artist/**
      - TestProjects/UnityArtistVerification/**
      - Tests/Compatibility/**
      - skills/unity-artist-unity-api-compatibility/**

jobs:
  static-matrix:
    name: Release matrix and pre-mutation compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - unity-2022.3-builtin
          - unity-6-builtin
          - unity-6-urp
          - unity-6-hdrp
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Validate compatibility buckets
        run: python3 Tests/Compatibility/verify-unity-api-compatibility.py
      - name: Record fixture
        run: echo "Fixture ${{ matrix.fixture }} is covered by support-matrix.yaml; Direct Editor execution is a separate environment gate."
