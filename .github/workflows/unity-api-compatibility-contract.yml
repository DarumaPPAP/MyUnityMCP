name: Unity API Compatibility Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - Packages/com.darumappap.my-unity-mcp/**/*.cs
      - Packages/com.darumappap.my-unity-mcp/**/*.asmdef
      - Packages/com.darumappap.my-unity-mcp/package.json
      - Specs/Compatibility/**
      - Tests/Compatibility/**
      - skills/myunitymcp-unity-api-compatibility/**
      - AGENTS.md
      - .github/workflows/unity-api-compatibility-contract.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  compatibility-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify compatibility source of truth
        run: python3 Tests/Compatibility/verify-unity-api-compatibility.py

      - name: Verify added Unity API usage
        if: github.event_name == 'pull_request'
        run: python3 Tests/Compatibility/verify-unity-api-compatibility.py --diff-base origin/${{ github.base_ref }}

  delete-release-v1-branch:
    if: github.event_name == 'pull_request' && github.head_ref == 'maintenance/delete-release-v1-branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/delete-release-v1-branch
          fetch-depth: 0
          persist-credentials: true

      - name: Delete obsolete release branch and self-clean maintenance branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete release/v1.0.0
          git push origin --delete maintenance/delete-release-v1-branch
