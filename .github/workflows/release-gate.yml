name: MyUnityMCP Release Gate

on:
  pull_request:
    branches: [main]
    paths:
      - VERSION
      - README.md
      - CHANGELOG.md
      - RELEASE_NOTES.md
      - Catalog/**
      - Design/**
      - Packages/com.darumappap.my-unity-mcp/**
      - Templates/**
      - Specs/**
      - Tests/Compatibility/**
      - Tests/Release/**
      - Tests/Routing/**
      - .github/workflows/release-gate.yml
      - .github/workflows/release-tag.yml
  workflow_dispatch: {}

concurrency:
  group: myunitymcp-release-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Release static contracts and distribution layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install contract validator dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - run: python3 Tests/Release/verify_source_of_truth_consistency.py
      - run: python3 Tests/Release/verify_capability_contract.py
      - run: python3 Tests/Release/verify_production_surface_contract.py
      - run: python3 Tests/Release/verify_agent_runtime_catalog.py
      - run: python3 Tests/Release/verify_agent_safety_contract.py
      - run: python3 Tests/Release/verify_release_contract.py --mode pr
      - run: python3 Tests/Release/verify_immutable_release_workflow.py
      - name: Resolve preview version
        id: preview-version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build preview distribution
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.preview-version.outputs.version }}"
          mkdir -p artifacts
          (cd Packages/com.darumappap.my-unity-mcp && npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts")
          zip -qr "artifacts/MyUnityMCP-Templates-${version}.zip" Templates
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: MyUnityMCP-v${{ steps.preview-version.outputs.version }}-Distribution-Preview
          path: artifacts
          retention-days: 14
