name: UnityArtistCLI Release Gate

on:
  pull_request:
    branches: [main]
    paths:
      - VERSION
      - README.md
      - CHANGELOG.md
      - RELEASE_NOTES.md
      - Catalog/**
      - Design/**
      - Packages/com.darumappap.unity-artist/**
      - src/UnityArtist.Cli/**
      - .agents/plugins/**
      - Templates/**
      - Specs/**
      - Tests/Compatibility/**
      - Tests/Release/**
      - Tests/Routing/**
      - .github/workflows/release-gate.yml
      - .github/workflows/release-tag.yml
  workflow_dispatch: {}

concurrency:
  group: unity-artist-release-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Release static contracts and distribution layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install contract validator dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - run: python3 Tests/Release/verify_unity_artist_contract.py
      - run: python3 Tests/Compatibility/verify-unity-api-compatibility.py
      - name: Build host CLI
        run: dotnet build src/UnityArtist.Cli/UnityArtist.Cli.csproj --configuration Release
      - name: Resolve preview version
        id: preview-version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build preview distribution
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.preview-version.outputs.version }}"
          mkdir -p artifacts
          (cd Packages/com.darumappap.unity-artist && npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts")
          zip -qr "artifacts/UnityArtistCLI-Templates-${version}.zip" Templates
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: UnityArtistCLI-v${{ steps.preview-version.outputs.version }}-Distribution-Preview
          path: artifacts
          retention-days: 14
