name: Semantic Naming Code Migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'refactor/semantic-feature-names' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/semantic-feature-names

      - name: Apply non-workflow migration
        run: python3 Tools/Repository/semantic_naming_non_workflow_migration.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes."
            exit 0
          fi
          git commit -m "refactor: replace delivery phase names with capability names"
          git push origin HEAD:refactor/semantic-feature-names
