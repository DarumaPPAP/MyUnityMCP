name: Phase 4D Unity Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - Packages/com.darumappap.my-unity-mcp/**
      - TestProjects/MyUnityMCPPhase1/**
      - .github/workflows/phase1-unity-verification.yml
  workflow_dispatch: {}

concurrency:
  group: phase4d-unity-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: Compile, 27 Tool Discovery and 98 EditMode Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Require Unity license secrets
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -euo pipefail

          has_license=false
          has_email=false
          has_password=false
          has_serial=false

          [ -n "$UNITY_LICENSE" ] && has_license=true
          [ -n "$UNITY_EMAIL" ] && has_email=true
          [ -n "$UNITY_PASSWORD" ] && has_password=true
          [ -n "$UNITY_SERIAL" ] && has_serial=true

          {
            echo "## Unity secret presence"
            echo
            echo "- UNITY_LICENSE: $has_license"
            echo "- UNITY_EMAIL: $has_email"
            echo "- UNITY_PASSWORD: $has_password"
            echo "- UNITY_SERIAL: $has_serial"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$has_license" = true ] && [ "$has_email" = true ] && [ "$has_password" = true ]; then
            echo "mode=personal" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$has_email" = true ] && [ "$has_password" = true ] && [ "$has_serial" = true ]; then
            echo "mode=serial" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Unity license secrets are incomplete or unavailable. Personal requires UNITY_LICENSE + UNITY_EMAIL + UNITY_PASSWORD. Serial licensing requires UNITY_EMAIL + UNITY_PASSWORD + UNITY_SERIAL."
          exit 1

      - name: Free disk space for Unity Docker image
        run: |
          set -euo pipefail
          echo "Disk usage before cleanup:"
          df -h /
          docker system prune --all --force || true
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Disk usage after cleanup:"
          df -h /

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: TestProjects/MyUnityMCPPhase1/Library
          key: MyUnityMCP-Phase4D-6000.0.75f1-${{ hashFiles('Packages/com.darumappap.my-unity-mcp/**', 'TestProjects/MyUnityMCPPhase1/Packages/manifest.json') }}
          restore-keys: |
            MyUnityMCP-Phase4D-6000.0.75f1-
            MyUnityMCP-Phase4C-6000.0.75f1-
            MyUnityMCP-Phase4-6000.0.75f1-
            MyUnityMCP-Phase3-6000.0.75f1-
            MyUnityMCP-Phase3A-6000.0.75f1-
            MyUnityMCP-Phase2-6000.0.75f1-
            MyUnityMCP-Phase1-6000.0.75f1-

      - name: Run Phase 4D EditMode tests
        id: tests
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: TestProjects/MyUnityMCPPhase1
          unityVersion: 6000.0.75f1
          testMode: editmode
          customParameters: -testFilter UnityGraphicsMcp

      - name: Verify Phase 4D NUnit result
        if: always() && steps.license.outputs.available == 'true'
        env:
          ARTIFACTS_PATH: ${{ steps.tests.outputs.artifactsPath }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail

          if [ "$TEST_OUTCOME" != "success" ]; then
            echo "::error::game-ci test runner outcome was $TEST_OUTCOME. Compile, Editor startup, or tests failed."
            if [ -d "$ARTIFACTS_PATH" ]; then
              find "$ARTIFACTS_PATH" -maxdepth 3 -type f -print || true
            fi
            exit 1
          fi

          results_xml=$(find "$ARTIFACTS_PATH" -name '*.xml' -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2- || true)
          if [ -z "$results_xml" ]; then
            echo "::error::Unity produced no NUnit XML."
            exit 1
          fi

          python3 - "$results_xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          total = int(root.attrib.get("total", "0"))
          passed = int(root.attrib.get("passed", "0"))
          failed = int(root.attrib.get("failed", "0"))
          skipped = int(root.attrib.get("skipped", "0"))
          inconclusive = int(root.attrib.get("inconclusive", "0"))

          print(f"Phase 4D results: total={total}, passed={passed}, failed={failed}, skipped={skipped}, inconclusive={inconclusive}")
          if total < 98:
              raise SystemExit(f"Expected at least 98 Phase 1-4D contract tests, but only {total} ran.")
          if failed != 0 or skipped != 0 or inconclusive != 0 or passed != total:
              for case in root.iter("test-case"):
                  if case.attrib.get("result") != "Passed":
                      name = case.attrib.get("fullname") or case.attrib.get("name") or "<unknown>"
                      message = case.findtext("failure/message") or ""
                      print(f"NON-PASS: {name}: {message}")
              raise SystemExit(1)
          PY

      - name: Upload Phase 4D Unity evidence
        if: always() && steps.license.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MyUnityMCP-Phase4D-Unity-Evidence
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: error
