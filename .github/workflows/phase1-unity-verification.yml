name: Phase 3A Unity Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - Packages/com.darumappap.my-unity-mcp/**
      - TestProjects/MyUnityMCPPhase1/**
      - .github/workflows/phase1-unity-verification.yml
  workflow_dispatch: {}

concurrency:
  group: phase3a-unity-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: Compile, Bridge Discovery and EditMode
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true
          ref: ${{ github.head_ref }}

      - name: Apply Unity 6000 Scene handle compatibility fix
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("Packages/com.darumappap.my-unity-mcp/Editor/UnityGraphicsMcpMutation.cs")
          source = path.read_text(encoding="utf-8")

          apply_old = """\t\t\t\t\t\tScene scene = SceneManager.GetSceneByHandle(operation.TargetSceneHandle);\n\t\t\t\t\t\tGameObject gameObject = new GameObject(operation.Name);"""
          apply_new = """\t\t\t\t\t\tScene scene;\n\t\t\t\t\t\tif (!TryResolveLoadedSceneByHandle(operation.TargetSceneHandle, out scene))\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\tthrow new InvalidOperationException(\n\t\t\t\t\t\t\t\t\"LIGHT_CREATE対象SceneがLoaded Sceneとして解決できません。\");\n\t\t\t\t\t\t}\n\n\t\t\t\t\t\tGameObject gameObject = new GameObject(operation.Name);"""

          validate_old = """\t\t\t\t\tScene scene = SceneManager.GetSceneByHandle(operation.TargetSceneHandle);\n\t\t\t\t\tif (!scene.IsValid() || !scene.isLoaded ||\n\t\t\t\t\t\tNormalizeSceneLabel(scene) != operation.TargetScenePath)"""
          validate_new = """\t\t\t\t\tScene scene;\n\t\t\t\t\tif (!TryResolveLoadedSceneByHandle(operation.TargetSceneHandle, out scene) ||\n\t\t\t\t\t\tNormalizeSceneLabel(scene) != operation.TargetScenePath)"""

          helper_anchor = """\t\tprivate static bool TryResolveLoadedScene(string path, out Scene scene)\n\t\t{"""
          helper = """\t\tprivate static bool TryResolveLoadedSceneByHandle(int handle, out Scene scene)\n\t\t{\n\t\t\tfor (int index = 0; index < SceneManager.sceneCount; index++)\n\t\t\t{\n\t\t\t\tScene candidate = SceneManager.GetSceneAt(index);\n\t\t\t\tif (candidate.IsValid() && candidate.isLoaded && candidate.handle == handle)\n\t\t\t\t{\n\t\t\t\t\tscene = candidate;\n\t\t\t\t\treturn true;\n\t\t\t\t}\n\t\t\t}\n\n\t\t\tscene = default(Scene);\n\t\t\treturn false;\n\t\t}\n\n"""

          replacements = 0
          if apply_old in source:
              source = source.replace(apply_old, apply_new, 1)
              replacements += 1
          if validate_old in source:
              source = source.replace(validate_old, validate_new, 1)
              replacements += 1
          if "TryResolveLoadedSceneByHandle(int handle" not in source:
              if helper_anchor not in source:
                  raise SystemExit("Scene helper insertion anchor was not found.")
              source = source.replace(helper_anchor, helper + helper_anchor, 1)
              replacements += 1

          if "SceneManager.GetSceneByHandle" in source:
              raise SystemExit("Unsupported SceneManager.GetSceneByHandle call remains.")

          path.write_text(source, encoding="utf-8", newline="\n")
          print(f"Applied {replacements} compatibility edits.")
          PY

          if git diff --quiet -- Packages/com.darumappap.my-unity-mcp/Editor/UnityGraphicsMcpMutation.cs; then
            echo "Compatibility fix is already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Packages/com.darumappap.my-unity-mcp/Editor/UnityGraphicsMcpMutation.cs
            git commit -m "fix: Unity 6000でLoaded Sceneをhandle解決"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Require Unity license secrets
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -euo pipefail

          has_license=false
          has_email=false
          has_password=false
          has_serial=false

          [ -n "$UNITY_LICENSE" ] && has_license=true
          [ -n "$UNITY_EMAIL" ] && has_email=true
          [ -n "$UNITY_PASSWORD" ] && has_password=true
          [ -n "$UNITY_SERIAL" ] && has_serial=true

          {
            echo "## Unity secret presence"
            echo
            echo "- UNITY_LICENSE: $has_license"
            echo "- UNITY_EMAIL: $has_email"
            echo "- UNITY_PASSWORD: $has_password"
            echo "- UNITY_SERIAL: $has_serial"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$has_license" = true ] && [ "$has_email" = true ] && [ "$has_password" = true ]; then
            echo "mode=personal" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$has_email" = true ] && [ "$has_password" = true ] && [ "$has_serial" = true ]; then
            echo "mode=serial" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Unity license secrets are incomplete or unavailable. Personal requires UNITY_LICENSE + UNITY_EMAIL + UNITY_PASSWORD. Serial licensing requires UNITY_EMAIL + UNITY_PASSWORD + UNITY_SERIAL."
          exit 1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: TestProjects/MyUnityMCPPhase1/Library
          key: MyUnityMCP-Phase3A-6000.0.75f1-${{ hashFiles('Packages/com.darumappap.my-unity-mcp/**', 'TestProjects/MyUnityMCPPhase1/Packages/manifest.json') }}
          restore-keys: |
            MyUnityMCP-Phase3A-6000.0.75f1-
            MyUnityMCP-Phase2-6000.0.75f1-
            MyUnityMCP-Phase1-6000.0.75f1-

      - name: Run Phase 3A EditMode tests
        id: tests
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: TestProjects/MyUnityMCPPhase1
          unityVersion: 6000.0.75f1
          testMode: editmode
          customParameters: -testFilter UnityGraphicsMcp

      - name: Verify NUnit result
        if: always() && steps.license.outputs.available == 'true'
        env:
          ARTIFACTS_PATH: ${{ steps.tests.outputs.artifactsPath }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          results_xml=$(find "$ARTIFACTS_PATH" -name '*.xml' 2>/dev/null | head -1 || true)
          if [ -z "$results_xml" ]; then
            echo "::error::Unity produced no NUnit XML. Compile or Editor startup may have failed."
            exit 1
          fi

          python3 - "$results_xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          total = int(root.attrib.get("total", "0"))
          passed = int(root.attrib.get("passed", "0"))
          failed = int(root.attrib.get("failed", "0"))
          skipped = int(root.attrib.get("skipped", "0"))
          inconclusive = int(root.attrib.get("inconclusive", "0"))

          print(f"Phase 3A results: total={total}, passed={passed}, failed={failed}, skipped={skipped}, inconclusive={inconclusive}")
          if total <= 0:
              raise SystemExit("No Phase 3A test was executed.")
          if failed != 0 or inconclusive != 0:
              for case in root.iter("test-case"):
                  if case.attrib.get("result") == "Failed":
                      name = case.attrib.get("fullname") or case.attrib.get("name") or "<unknown>"
                      message = case.findtext("failure/message") or ""
                      print(f"FAILED: {name}: {message}")
              raise SystemExit(1)
          PY

          if [ "$TEST_OUTCOME" != "success" ]; then
            echo "::error::game-ci test runner outcome was $TEST_OUTCOME."
            exit 1
          fi

      - name: Upload Unity evidence
        if: always() && steps.license.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MyUnityMCP-Phase3A-Unity-Evidence
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: error
