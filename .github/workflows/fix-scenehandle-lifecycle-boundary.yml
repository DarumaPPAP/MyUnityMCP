name: Apply verified SceneHandle lifecycle boundary

on:
  push:
    branches:
      - fix/unity-6000-7-test2
    paths:
      - .github/workflows/fix-scenehandle-lifecycle-boundary.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unity-6000-7-test2
          fetch-depth: 0
          persist-credentials: true
      - name: Apply evidence-backed boundary updates
        shell: python
        run: |
          from pathlib import Path

          root = Path.cwd()

          def replace(path, old, new):
              p = root / path
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found: {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          for path in [
              "Packages/com.darumappap.my-unity-mcp/Tests/Editor/UnityGraphicsMcpCaptureEvidenceTests.cs",
              "Packages/com.darumappap.my-unity-mcp/Tests/Editor/UnityGraphicsMcpApvVisualAcceptanceTests.cs",
          ]:
              replace(
                  path,
                  "SceneManager.GetActiveScene().handle",
                  "UnityGraphicsMcpIdentityCompatibility.GetSceneToken(SceneManager.GetActiveScene())",
              )

          registry = "Packages/com.darumappap.my-unity-mcp/Editor/UnityApiCompatibility.cs"
          replace(
              registry,
              '''\t\t\t\tCreateRule(\n\t\t\t\t\t"UNITY-6000-7-SCENE-HANDLE-RAW-DATA",\n\t\t\t\t\tE_UNITY_API_PATCH_BUCKET.UNITY_6000_7,\n\t\t\t\t\t"Core",\n\t\t\t\t\t"SceneHandleとintの暗黙変換",\n\t\t\t\t\t"SceneHandle.GetRawData() / SceneHandle.FromRawData(ulong)、またはMyUnityMCP Session Token",\n\t\t\t\t\t"6000.7", null, "6000.7", null, null,\n\t\t\t\t\tE_UNITY_API_SOURCE_STATUS.CONFIRMED,\n\t\t\t\t\t"Unity 6000.7 alpha実Editor CompilerのCS0619で確認。永続ID用途へraw Handleを流用しません。"),''',
              '''\t\t\t\tCreateRule(\n\t\t\t\t\t"UNITY-6000-4-SCENE-HANDLE-RAW-DATA",\n\t\t\t\t\tE_UNITY_API_PATCH_BUCKET.UNITY_6000_4,\n\t\t\t\t\t"Core",\n\t\t\t\t\t"SceneHandleとint/uintの暗黙変換",\n\t\t\t\t\t"SceneHandle.GetRawData() / SceneHandle.FromRawData(ulong)、またはMyUnityMCP Session Token",\n\t\t\t\t\t"6000.4", "6000.4", "6000.5", null, null,\n\t\t\t\t\tE_UNITY_API_SOURCE_STATUS.CONFIRMED,\n\t\t\t\t\t"6000.4.12f1でCS0618 warning、6000.5.5f1でCS0619 errorをEditor CI実測。6.7 manual testでもerrorを確認。"),''',
          )

          tests = "Packages/com.darumappap.my-unity-mcp/Tests/Editor/UnityApiCompatibilityTests.cs"
          replace(
              tests,
              '''\t\t[Test]\n\t\tpublic void Resolve_6000_7_ContainsConfirmedSceneHandleBoundary()\n\t\t{\n\t\t\tDictionary<string, object> summary =\n\t\t\t\tUnityApiCompatibility.BuildProjectSummary("6000.7.0a3");\n\t\t\tList<Dictionary<string, object>> rules =\n\t\t\t\tsummary["rules"] as List<Dictionary<string, object>>;\n\n\t\t\tAssert.That(\n\t\t\t\trules.Any(item =>\n\t\t\t\t\t(string)item["ruleId"] == "UNITY-6000-7-SCENE-HANDLE-RAW-DATA" &&\n\t\t\t\t\t(string)item["state"] == "ERROR" &&\n\t\t\t\t\t(string)item["sourceStatus"] == E_UNITY_API_SOURCE_STATUS.CONFIRMED.ToString()),\n\t\t\t\tIs.True);\n\t\t}\n''',
              '''\t\t[Test]\n\t\tpublic void Resolve_6000_4_And_6000_5_TrackConfirmedSceneHandleBoundary()\n\t\t{\n\t\t\tDictionary<string, object> warningSummary =\n\t\t\t\tUnityApiCompatibility.BuildProjectSummary("6000.4.12f1");\n\t\t\tList<Dictionary<string, object>> warningRules =\n\t\t\t\twarningSummary["rules"] as List<Dictionary<string, object>>;\n\t\t\tDictionary<string, object> errorSummary =\n\t\t\t\tUnityApiCompatibility.BuildProjectSummary("6000.5.5f1");\n\t\t\tList<Dictionary<string, object>> errorRules =\n\t\t\t\terrorSummary["rules"] as List<Dictionary<string, object>>;\n\n\t\t\tAssert.That(\n\t\t\t\twarningRules.Any(item =>\n\t\t\t\t\t(string)item["ruleId"] == "UNITY-6000-4-SCENE-HANDLE-RAW-DATA" &&\n\t\t\t\t\t(string)item["state"] == "WARNING" &&\n\t\t\t\t\t(string)item["sourceStatus"] == E_UNITY_API_SOURCE_STATUS.CONFIRMED.ToString()),\n\t\t\t\tIs.True);\n\t\t\tAssert.That(\n\t\t\t\terrorRules.Any(item =>\n\t\t\t\t\t(string)item["ruleId"] == "UNITY-6000-4-SCENE-HANDLE-RAW-DATA" &&\n\t\t\t\t\t(string)item["state"] == "ERROR"),\n\t\t\t\tIs.True);\n\t\t}\n''',
          )

          verifier = "Tests/Compatibility/verify-unity-api-compatibility.py"
          replace(verifier, '"UNITY-6000-7-SCENE-HANDLE-RAW-DATA",', '"UNITY-6000-4-SCENE-HANDLE-RAW-DATA",')
          replace(verifier, '"Resolve_6000_7_ContainsConfirmedSceneHandleBoundary",', '"Resolve_6000_4_And_6000_5_TrackConfirmedSceneHandleBoundary",')
          replace(verifier, '"UNITY_6000_7_OR_NEWER",', '"UNITY_6000_4_OR_NEWER",')

          skill = "skills/myunitymcp-unity-api-compatibility/SKILL.md"
          replace(
              skill,
              "- SerializedProperty EntityId\n- URP Compatibility Mode removal\n",
              "- SerializedProperty EntityId\n- URP Compatibility Mode removal\n- SceneHandleのint/uint暗黙変換。6000.4でwarning開始、6000.5でerror化するためGetRawData()/Session Tokenへ先行移行\n",
          )
          replace(
              skill,
              "- `SceneHandle` と `int` の暗黙変換廃止\n",
              "",
          )
          marker = "## Known verified migrations\n\n"
          insert = '''## Known verified migrations\n\n### Unity 6000.4 / 6000.5 Editor CI — 2026-08-11\n\n実Editor CIで`SceneHandle`のLifecycle境界を確認しました。\n\n- Unity `6000.4.12f1`: `SceneHandle → uint/int`暗黙変換はCS0618 warning。`GetRawData()`への移行指示。\n- Unity `6000.5.5f1`: 同暗黙変換はCS0619 error。\n- このためRuleは`UNITY_6000_4` Bucketで管理し、`warningFrom=6000.4` / `errorFrom=6000.5`を正本とします。\n- Base実装はUnity 6000.4以降で`GetRawData()`を使用し、内部TransactionはSession Tokenへ隔離します。\n\n'''
          replace(skill, marker, insert)

      - name: Validate generated diff
        run: |
          python3 Tests/Compatibility/verify-unity-api-compatibility.py
          git diff --check
          ! grep -RIn --include='*.cs' 'SceneManager.GetActiveScene().handle' Packages/com.darumappap.my-unity-mcp/Tests/Editor
      - name: Commit boundary correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-scenehandle-lifecycle-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Tests skills .github/workflows/fix-scenehandle-lifecycle-boundary.yml
          git commit -m "Correct SceneHandle lifecycle boundary from Unity 6.4"
          git push origin HEAD:fix/unity-6000-7-test2
