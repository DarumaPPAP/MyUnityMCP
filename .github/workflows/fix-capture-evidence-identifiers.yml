name: Fix Capture Evidence Identifiers

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'refactor/semantic-feature-names' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/semantic-feature-names

      - name: Fix capture evidence identifiers
        run: python3 Tools/Repository/fix_capture_evidence_identifiers.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No identifier changes."
            exit 0
          fi
          git commit -m "fix: restore capture evidence helper references"
          git push origin HEAD:refactor/semantic-feature-names
