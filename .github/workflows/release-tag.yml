name: UnityArtistCLI Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag to publish after human review
        required: true
        type: string

jobs:
  release:
    name: Human-gated package release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release tag and current version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          test "$REQUESTED_TAG" = "v$version"
          git tag --verify "$REQUESTED_TAG" 2>/dev/null && { echo "Tag already exists; refusing to move it."; exit 1; } || true
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Validate contracts
        run: |
          python3 Tests/Release/verify_unity_artist_contract.py
          python3 Tests/Compatibility/verify-unity-api-compatibility.py
      - name: Build host CLI
        run: dotnet publish src/UnityArtist.Cli/UnityArtist.Cli.csproj --configuration Release --runtime win-x64 --self-contained true --output build/host-windows-x64
      - name: Package Windows host CLI
        run: |
          set -euo pipefail
          mkdir -p artifacts
          (cd build/host-windows-x64 && zip -qr "$GITHUB_WORKSPACE/artifacts/UnityArtistCLI-host-windows-x64.zip" .)
          sha256sum artifacts/UnityArtistCLI-host-windows-x64.zip > artifacts/UnityArtistCLI-host-windows-x64.zip.sha256
      - name: Pack Unity package
        run: |
          mkdir -p artifacts
          (cd Packages/com.darumappap.unity-artist && npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts")
          (cd artifacts && sha256sum *.zip *.tgz > SHA256SUMS.txt)
      - name: Create immutable tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: git tag -a "$REQUESTED_TAG" -m "UnityArtistCLI $REQUESTED_TAG"
      - name: Push immutable tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: git push origin "$REQUESTED_TAG"
      - name: Create GitHub Release with host archive
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$REQUESTED_TAG" \
            --verify-tag \
            --title "UnityArtistCLI $REQUESTED_TAG" \
            --notes-file RELEASE_NOTES.md \
            artifacts/UnityArtistCLI-host-windows-x64.zip \
            artifacts/UnityArtistCLI-host-windows-x64.zip.sha256 \
            artifacts/SHA256SUMS.txt \
            artifacts/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: UnityArtistCLI-${{ inputs.tag }}-Distribution
          path: artifacts
