name: MyUnityMCP Release

on:
  workflow_dispatch: {}
  issue_comment:
    types:
      - created

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.body == '/publish-myunitymcp-release' &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main release control
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve immutable release source
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          tag="v${version}"
          python3 Tests/Release/verify_release_contract.py --mode pr
          git fetch origin --tags --force

          release_kind="stable"
          if [[ "$version" == *-* ]]; then
            release_kind="prerelease"
          fi

          release_mode="create"
          source_commit=$(git rev-parse HEAD)

          if git rev-parse "$tag" >/dev/null 2>&1; then
            release_mode="verify_existing"
            source_commit=$(git rev-parse "$tag^{commit}")
            echo "::notice::$tag is already published and immutable. Reusing tagged source $source_commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "MyUnityMCP ${tag}"
            git push origin "$tag"
          fi

          git checkout --detach "$source_commit"
          if [ "$release_kind" = "stable" ]; then
            python3 Tests/Release/verify_release_contract.py --mode tag --tag "$tag"
          else
            echo "::notice::Prerelease detected ($version). Stable release evidence gate is intentionally skipped; manual verification may still be pending."
            python3 Tests/Release/verify_release_contract.py --mode pr
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "release_mode=$release_mode" >> "$GITHUB_OUTPUT"
          echo "release_kind=$release_kind" >> "$GITHUB_OUTPUT"

      - name: Build release distribution from immutable source
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.identity.outputs.version }}"
          mkdir -p artifacts
          (cd Packages/com.darumappap.my-unity-mcp && npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts")
          zip -qr "artifacts/MyUnityMCP-SampleProject-${version}.zip" SampleProjects/MyUnityMCPGettingStarted
          zip -qr "artifacts/MyUnityMCP-Templates-${version}.zip" Templates
          (cd artifacts && sha256sum * > SHA256SUMS.txt)

      - name: Publish or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_KIND: ${{ steps.identity.outputs.release_kind }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$RELEASE_KIND" = "prerelease" ]; then
              gh release edit "$TAG" \
                --title "MyUnityMCP $TAG" \
                --notes-file RELEASE_NOTES.md \
                --prerelease
            else
              gh release edit "$TAG" \
                --title "MyUnityMCP $TAG" \
                --notes-file RELEASE_NOTES.md
            fi
            gh release upload "$TAG" artifacts/* --clobber
          else
            if [ "$RELEASE_KIND" = "prerelease" ]; then
              gh release create "$TAG" artifacts/* \
                --title "MyUnityMCP $TAG" \
                --notes-file RELEASE_NOTES.md \
                --prerelease \
                --verify-tag
            else
              gh release create "$TAG" artifacts/* \
                --title "MyUnityMCP $TAG" \
                --notes-file RELEASE_NOTES.md \
                --verify-tag
            fi
          fi
