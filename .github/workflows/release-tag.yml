name: MyUnityMCP Release

on:
  workflow_dispatch: {}
  issue_comment:
    types:
      - created
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.body == '/publish-myunitymcp-release' &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'release/publish-v1.0.0'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main release commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify release contract and publish version tag
        id: identity
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          tag="v${version}"
          python3 Tests/Release/verify_release_contract.py --mode pr
          git fetch origin --tags --force
          if git rev-parse "$tag" >/dev/null 2>&1; then
            if [ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$tag already points to a different commit."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "MyUnityMCP ${tag}"
            git push origin "$tag"
          fi
          python3 Tests/Release/verify_release_contract.py --mode tag --tag "$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release distribution
        run: |
          set -euo pipefail
          version="${{ steps.identity.outputs.version }}"
          mkdir -p artifacts
          (cd Packages/com.darumappap.my-unity-mcp && npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts")
          zip -qr "artifacts/MyUnityMCP-SampleProject-${version}.zip" SampleProjects/MyUnityMCPGettingStarted
          zip -qr "artifacts/MyUnityMCP-Templates-${version}.zip" Templates
          (cd artifacts && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "MyUnityMCP $TAG" \
              --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "MyUnityMCP $TAG" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag
          fi
