name: MyUnityMCP Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify release contract and publish version tag
        id: identity
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          tag="v${version}"
          python3 Tests/Release/verify_release_contract.py --mode pr
          git fetch origin --tags --force
          if git rev-parse "$tag" >/dev/null 2>&1; then
            if [ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$tag already points to a different commit."
              exit 1
            fi
          else
            git tag -a "$tag" -m "MyUnityMCP ${tag}"
            git push origin "$tag"
          fi
          python3 Tests/Release/verify_release_contract.py --mode tag --tag "$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release distribution
        run: |
          set -euo pipefail
          version="${{ steps.identity.outputs.version }}"
          mkdir -p artifacts
          (cd Packages/com.darumappap.my-unity-mcp && npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts")
          zip -qr "artifacts/MyUnityMCP-SampleProject-${version}.zip" SampleProjects/MyUnityMCPGettingStarted
          zip -qr "artifacts/MyUnityMCP-Templates-${version}.zip" Templates
          (cd artifacts && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "MyUnityMCP $TAG" \
              --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "MyUnityMCP $TAG" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag
          fi
