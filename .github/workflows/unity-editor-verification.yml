name: UnityArtistCLI Editor Verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Packages/com.darumappap.unity-artist/**
      - src/UnityArtist.Cli/**
      - TestProjects/UnityArtistVerification/**
      - Tests/**
      - Catalog/**
      - Specs/**
      - .agents/plugins/**

jobs:
  host-contract:
    name: Host and contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Build host CLI
        run: dotnet build src/UnityArtist.Cli/UnityArtist.Cli.csproj --configuration Release
      - name: Validate production contract
        run: python3 Tests/Release/verify_unity_artist_contract.py
      - name: Validate compatibility contract
        run: python3 Tests/Compatibility/verify-unity-api-compatibility.py
      - name: Validate semantic naming
        run: python3 Tests/Compatibility/verify-semantic-names.py
