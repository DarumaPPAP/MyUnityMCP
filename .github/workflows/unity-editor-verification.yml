name: UnityArtistCLI Editor Verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Packages/com.darumappap.unity-artist/**
      - src/UnityArtist.Cli/**
      - TestProjects/UnityArtistVerification/**
      - Tests/**
      - Catalog/**
      - Specs/**
      - .agents/plugins/**

jobs:
  host-contract:
    name: Host and contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Build host CLI
        run: dotnet build src/UnityArtist.Cli/UnityArtist.Cli.csproj --configuration Release
      - name: Validate production contract
        run: python3 Tests/Release/verify_unity_artist_contract.py
      - name: Validate compatibility contract
        run: python3 Tests/Compatibility/verify-unity-api-compatibility.py
      - name: Validate semantic naming
        run: python3 Tests/Compatibility/verify-semantic-names.py
      - name: Validate minimal smoke runner contract
        run: python3 -m unittest Tests/Minimal/test_minimal_smoke_contract.py
      - name: Validate checked-in URP and HDRP evidence contracts
        run: |
          python3 Tests/Compatibility/verify-primary-urp-evidence.py
          python3 Tests/Compatibility/verify-cinematic-evidence.py
          python3 Tests/Compatibility/verify-hdrp-primary-evidence.py
          python3 Tests/Compatibility/verify-hdrp-cinematic-evidence.py
          python3 Tests/Compatibility/verify-cli-pipeline-gate-evidence.py
