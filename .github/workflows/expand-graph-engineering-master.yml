name: Expand Graph Engineering Master

on:
  push:
    branches:
      - feature/graph-engineering-master
    paths:
      - .github/workflows/expand-graph-engineering-master.yml

permissions:
  contents: write

concurrency:
  group: expand-graph-engineering-master
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/graph-engineering-master
          fetch-depth: 0

      - name: Restore and expand Master archive
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          repository_root = Path.cwd().resolve()
          target_root = repository_root / "Development" / "GraphEngineering"
          archive_root = target_root / "source-archive"
          expected_sha256 = "6f1bbe47a56200a9361bd7d8038b28f9f432dfa1e2f25a29ed1c372fe26dde2d"
          archive_prefix = PurePosixPath("MyUnityMCP_GraphEngineering_Master")

          chunks = sorted(archive_root.glob("MyUnityMCP_GraphEngineering_Masters.zip.b64.*"))
          if not chunks:
              raise RuntimeError("Master archive chunks were not found.")

          encoded = "".join(path.read_text(encoding="ascii").strip() for path in chunks)
          archive_bytes = base64.b64decode(encoded, validate=True)
          actual_sha256 = hashlib.sha256(archive_bytes).hexdigest()
          if actual_sha256 != expected_sha256:
              raise RuntimeError(
                  f"Master archive SHA-256 mismatch: expected={expected_sha256}, actual={actual_sha256}"
              )

          extracted_files = 0
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              bad_file = archive.testzip()
              if bad_file is not None:
                  raise RuntimeError(f"Corrupted ZIP entry: {bad_file}")

              for info in archive.infolist():
                  source_path = PurePosixPath(info.filename)
                  if info.is_dir():
                      continue
                  if not source_path.parts or source_path.parts[0] != archive_prefix.name:
                      raise RuntimeError(f"Unexpected archive root: {info.filename}")

                  relative_path = PurePosixPath(*source_path.parts[1:])
                  if not relative_path.parts or ".." in relative_path.parts:
                      raise RuntimeError(f"Unsafe archive path: {info.filename}")

                  destination = (target_root / Path(*relative_path.parts)).resolve()
                  if target_root.resolve() not in destination.parents:
                      raise RuntimeError(f"Archive path escaped target root: {info.filename}")

                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read(info))
                  extracted_files += 1

          if extracted_files != 73:
              raise RuntimeError(f"Unexpected extracted file count: {extracted_files}")

          shutil.rmtree(archive_root)
          upload_manifest = target_root / "upload-manifest.json"
          if upload_manifest.exists():
              upload_manifest.unlink()

          workflow_path = repository_root / ".github" / "workflows" / "expand-graph-engineering-master.yml"
          workflow_path.unlink()

          print(f"Expanded {extracted_files} files into {target_root}")
          print(f"Verified SHA-256: {actual_sha256}")
          PY

      - name: Validate expanded Master
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cd Development/GraphEngineering
          python -m unittest discover -s tests -v
          python scripts/roadmap_harness.py validate
          python scripts/roadmap_harness.py status

      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: expand Graph Engineering Master source"
          git push origin HEAD:feature/graph-engineering-master
