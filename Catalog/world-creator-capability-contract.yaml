schema_version: "1.0"
module: world_creator
status: delivery_candidate_manual_verification_pending

principles:
  progressive_disclosure: true
  explicit_activation_required: true
  unavailable_is_not_passed: true
  capture_is_not_visual_acceptance: true
  compile_is_not_runtime_acceptance: true
  no_silent_fallback: true

capabilities:
  creator:
    mode: orchestration
    use_when:
      - a visual world goal requires a safe read-only project and scene preflight before production planning
      - project, scene, and graphics validation should be collected through one creator workflow
      - the next production action must be handed to a human reviewer instead of automatically mutating Unity
    requires:
      - visual_goal
      - current_editor_revision
      - operational_unity_agent_mcp
      - operational_unity_graphics_mcp
    must_not:
      - directly_mutate_unity
      - bypass_unity_agent_validation
      - automatically_save
      - automatically_bake
      - automatically_accept_visual_result
      - reinterpret_failed_preflight_as_success
    success_evidence:
      - current_revision_accepted
      - graph_compiled
      - read_only_preflight_completed
      - three_of_three_preflight_steps_succeeded
      - human_review_handoff_created
      - no_direct_unity_mutation

tools:
  - world.compile_workflow
  - world.start_preflight
  - world.create_review_handoff

preflight:
  control_plane: unity_agent_mcp
  delegate_domain: unity_graphics_mcp
  steps:
    - graphics.inspect_project
    - graphics.inspect_scene
    - graphics.validate_scene
  mutation: false

handoff:
  required_status: HUMAN_REVIEW_REQUIRED
  next_stage_is_automatic_execution: false
  downstream_mutation_requires_existing_domain_approval: true
  downstream_save_requires_existing_domain_approval: true
  downstream_bake_requires_existing_domain_approval: true
