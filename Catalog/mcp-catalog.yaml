schema_version: "2.3"
release_version: "1.1.0"
capability_contracts: Catalog/capability-contracts.yaml
integration_contracts: Catalog/stage2-8-integration-contracts.yaml

modules:
  unity_graphics_mcp:
    kind: domain
    status: editor_operational
    manifest: Packages/com.darumappap.my-unity-mcp/MCP_MANIFEST.yaml
    specification: Specs/UnityGraphicsMCP/spec.md
    capability_contract: Catalog/capability-contracts.yaml
    default_tool_group: inspect
    available_tool_groups:
      - inspect
      - plan
      - mutate
      - save
      - bake
      - capture
      - evaluate
      - review_and_refine
      - execution

  unity_agent_mcp:
    kind: control_plane
    status: editor_operational
    manifest: Packages/com.darumappap.my-unity-mcp/MCP_MANIFEST.yaml
    runtime_catalog: Packages/com.darumappap.my-unity-mcp/Editor/Development/Agent/UnityAgentMcpCatalog.json
    capability_contract: Catalog/unity-agent-capability-contracts.yaml
    default_tool_group: agent
    available_tool_groups:
      - agent
    direct_unity_mutation_allowed: false

  world_creator:
    kind: creator
    status: editor_operational
    manifest: Packages/com.darumappap.my-unity-mcp/MCP_MANIFEST.yaml
    specification: Specs/UnityWorldCreatorMCP/spec.md
    capability_contract: Catalog/world-creator-capability-contract.yaml
    default_tool_group: creator
    available_tool_groups:
      - creator
    direct_unity_mutation_allowed: false
    orchestration_control_plane: unity_agent_mcp
    operational_delegate_domains:
      - unity_graphics_mcp

  unity_profiler_mcp:
    kind: domain
    status: integration_candidate
    integration_contract: Catalog/stage2-8-integration-contracts.yaml
    default_tool_group: profiler
    available_tool_groups: [profiler]
    tools: 8

  unity_addressables_mcp:
    kind: optional_domain
    status: integration_candidate
    integration_contract: Catalog/stage2-8-integration-contracts.yaml
    default_tool_group: addressables
    available_tool_groups: [addressables]
    tools: 4
    required_package: com.unity.addressables
    content_build: excluded_from_current_mcp_surface

  unity_ui_mcp:
    kind: domain
    status: integration_candidate
    integration_contract: Catalog/stage2-8-integration-contracts.yaml
    default_tool_group: ui
    available_tool_groups: [ui]
    tools: 5

  unity_animation_mcp:
    kind: domain
    status: integration_candidate
    integration_contract: Catalog/stage2-8-integration-contracts.yaml
    default_tool_group: animation
    available_tool_groups: [animation]
    tools: 5

  unity_audio_mcp:
    kind: domain
    status: integration_candidate
    integration_contract: Catalog/stage2-8-integration-contracts.yaml
    default_tool_group: audio
    available_tool_groups: [audio]
    tools: 5

  unity_cinematic_mcp:
    kind: domain
    status: integration_candidate
    integration_contract: Catalog/stage2-8-integration-contracts.yaml
    default_tool_group: cinematic
    available_tool_groups: [cinematic]
    tools: 5

selection:
  load_all_tool_schemas: false
  load_package_source_by_default: false
  explicit_tool_activation_required: true
  capability_contract_required_for_operational_module: true
  integration_contract_required_for_candidate_module: true
  load_only_selected_capability_contract: true

promotion_policy:
  production_verified_tool_count: 45
  integration_target_tool_count: 77
  stage2_8_validation_status: local_cg_runtime_verified_ci_unavailable
  local_cg_runtime_validation: passed
  automated_ci: unavailable_not_verified
  human_promotion_gate: pending
  integration_candidate_is_not_production_operational: true
  intermediate_main_merge: prohibited
