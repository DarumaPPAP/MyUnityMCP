schema_version: "2.2"
release_version: "1.0.1"
capability_contracts: Catalog/capability-contracts.yaml

modules:
  unity_graphics_mcp:
    kind: domain
    status: editor_operational
    manifest: Packages/com.darumappap.my-unity-mcp/MCP_MANIFEST.yaml
    specification: Specs/UnityGraphicsMCP/spec.md
    capability_contract: Catalog/capability-contracts.yaml
    default_tool_group: inspect
    available_tool_groups:
      - inspect
      - plan
      - mutate
      - save
      - bake
      - capture
      - evaluate
      - review_and_refine
      - execution
    use_when:
      - Unity graphics project and scene inspection
      - approval gated graphics mutation and save
      - explicit dependency or APV bake
      - capture evidence and visual evaluation
      - long running execution tracking
    do_not_use_when:
      - gameplay logic only
      - player build orchestration only
      - shader source repair only

  unity_agent_mcp:
    kind: control_plane
    status: editor_operational
    manifest: Packages/com.darumappap.my-unity-mcp/MCP_MANIFEST.yaml
    runtime_catalog: Packages/com.darumappap.my-unity-mcp/Editor/Development/Agent/UnityAgentMcpCatalog.json
    capability_contract: Catalog/unity-agent-capability-contracts.yaml
    default_tool_group: agent
    available_tool_groups:
      - agent
    use_when:
      - multiple MCP steps require dependency validation and deterministic ordering
      - a workflow requires preview, approval orchestration, cancellation, timeout, or execution history
      - execution must delegate to an operational Domain MCP without direct control-plane mutation
    do_not_use_when:
      - a single direct read-only Domain tool is sufficient
      - the requested Domain is not operational in the current production catalog
      - the workflow would require bypassing explicit approval or revision checks
    direct_unity_mutation_allowed: false

selection:
  load_all_tool_schemas: false
  load_package_source_by_default: false
  explicit_tool_activation_required: true
  capability_contract_required_for_operational_module: true
  load_only_selected_capability_contract: true
