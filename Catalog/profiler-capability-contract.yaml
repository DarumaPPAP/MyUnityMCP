schema_version: "1.0"
module: unity_profiler_mcp
status: editor_operational

principles:
  progressive_disclosure: true
  explicit_activation_required: true
  unavailable_is_not_passed: true
  capture_is_not_visual_acceptance: true
  compile_is_not_runtime_acceptance: true
  no_silent_fallback: true

capabilities:
  profiler:
    mode: editor_domain
    use_when:
      - inspect Unity Editor profiling environment and counters
      - capture a bounded profiling sample or compare it with a compatible baseline
    requires:
      - explicit_tool_activation
      - current_editor_environment_identity
      - prepared_capture_scope_before_capture_control
      - same_environment_baseline_for_direct_comparison
    must_not:
      - mutate_project_assets
      - automatically_save
      - claim_target_device_performance_without_target_device_evidence
      - compare_incompatible_environments_as_equivalent
      - reinterpret_unavailable_counter_or_capture_backend_as_success
    success_evidence:
      - editor_environment_identity
      - requested_counter_or_capture_result
      - terminal_or_current_capture_state
      - baseline_compatibility_result_when_comparing
