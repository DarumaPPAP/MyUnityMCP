schema_version: "2.1"
release_version: "1.1.0"

capabilities:
  graphics:
    owner: unity_graphics_mcp
    status: editor_operational
    modules:
      project_and_scene_inspection: implemented_editor_verified
      direction_planning: implemented_editor_verified
      light_mutation: create_update_undo_editor_verified
      camera_mutation: create_update_undo_editor_verified
      reflection_probe_mutation: create_update_undo_editor_verified
      volume_mutation: conditional_volume_api
      explicit_scene_save: implemented_editor_verified
      dependency_bake: conditional_explicit_backend
      adaptive_probe_volume_bake: conditional_urp_hdrp_backend
      capture_evidence: conditional_graphics_device
      visual_evaluation: implemented_editor_verified
      human_visual_review: implemented_editor_verified
      structured_refine: implemented_editor_verified
      execution_hardening: implemented_editor_verified
    limitations:
      - no_generic_serialized_property_mutation
      - no_automatic_save
      - no_automatic_full_bake
      - no_automatic_visual_acceptance
      - player_runtime_tool_execution_unsupported

  agent:
    owner: unity_agent_mcp
    status: editor_operational
    modules:
      capability_discovery: implemented_editor_verified
      workflow_validation: implemented_editor_verified
      dependency_graph_compile: implemented_editor_verified
      read_only_execution_preview: implemented_editor_verified
      explicit_approval_orchestration: implemented_editor_verified
      cooperative_execution: implemented_editor_verified
      cancellation_and_timeout: implemented_editor_verified
      execution_history: implemented_editor_verified
      structured_error_catalog: implemented_editor_verified
    delegates_to:
      - unity_graphics_mcp
    limitations:
      - no_direct_unity_mutation
      - non_operational_domains_are_rejected
      - no_automatic_execution_resume
      - no_approval_bypass

  cinematic:
    owner: unity_cinematic_mcp
    status: design_only_not_executable
  ui:
    owner: unity_ui_mcp
    status: design_only_not_executable
  addressables:
    owner: unity_addressables_mcp
    status: design_only_not_executable
  animation:
    owner: unity_animation_mcp
    status: design_only_not_executable
  audio:
    owner: unity_audio_mcp
    status: design_only_not_executable
  profiler:
    owner: unity_profiler_mcp
    status: design_only_not_executable
  build:
    owner: unity_build_mcp
    status: design_only_not_executable

rules:
  explicit_tool_activation_required: true
  capability_does_not_make_human_acceptance_decisions: true
  generic_serialized_property_mutation_is_prohibited: true
  silent_fallback_is_prohibited: true
  control_plane_direct_mutation_is_prohibited: true
