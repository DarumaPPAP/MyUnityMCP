schema_version: "1.1"
release_version: "1.0.0"

creators:
  live_creator:
    kind: workflow_design
    status: specified_not_executable
    workflow: Workflows/LiveCreator.yaml
    blocked_by:
      - unity_agent_mcp_runtime_not_implemented
      - unity_cinematic_mcp_not_implemented
  movie_creator:
    kind: workflow_design
    status: specified_not_executable
    workflow: Workflows/MovieCreator.yaml
    blocked_by:
      - unity_agent_mcp_runtime_not_implemented
      - unity_cinematic_mcp_not_implemented
  world_creator:
    kind: workflow_design
    status: specified_not_executable
    blocked_by:
      - unity_agent_mcp_runtime_not_implemented

rules:
  creator_does_not_mutate_unity_directly: true
  unavailable_creator_returns_blocking_domains: true
  unity_graphics_mcp_is_available_as_independent_domain: true
