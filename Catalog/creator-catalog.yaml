schema_version: "2.0"
release_version: "1.0.0"
development_branch: feature/graph-engineering-master

creators:
  world_creator:
    kind: product_runtime_creator
    status: implementation_in_progress_unverified
    tools:
      - world.compile_workflow
      - world.start_preflight
      - world.create_review_handoff
    implemented_vertical_slice:
      - visual_goal_validation
      - graphics_project_inspection
      - graphics_scene_inspection
      - graphics_validation
      - human_review_handoff
    direct_unity_mutation: false
    execution_ready: false
    blocking_evidence:
      - unity_editor_compile
      - editor_contract_tests
      - external_mcp_client_e2e

  movie_creator:
    kind: product_runtime_creator
    status: implementation_in_progress_unverified
    workflow: Workflows/MovieCreator.yaml
    tools:
      - movie.compile_production
      - movie.preview_production
      - movie.create_review_handoff
    implemented_vertical_slice:
      - shot_list_validation
      - shot_timing_compile
      - domain_step_projection
      - human_visual_review_handoff
    direct_unity_mutation: false
    automatic_visual_acceptance: false
    execution_ready: false
    blocked_by:
      - unity_cinematic_mcp_not_editor_operational
      - unity_editor_compile_evidence_missing
      - human_visual_review_evidence_missing

  live_creator:
    kind: product_runtime_creator
    status: implementation_in_progress_unverified
    workflow: Workflows/LiveCreator.yaml
    tools:
      - live.compile_show
      - live.preview_show
      - live.create_operator_handoff
    implemented_vertical_slice:
      - cue_validation
      - cue_timing_compile
      - domain_tool_validation
      - recovery_cue_validation
      - operator_handoff
    direct_unity_mutation: false
    unattended_execution: prohibited
    automatic_go_live: false
    operator_required: true
    execution_ready: false
    blocked_by:
      - required_domains_not_editor_operational
      - unity_editor_compile_evidence_missing
      - operator_review_evidence_missing

rules:
  creator_does_not_mutate_unity_directly: true
  creator_delegates_to_domain_tools: true
  unavailable_creator_returns_blocking_domains: true
  automatic_save: false
  automatic_visual_acceptance: false
  live_unattended_execution: false
  human_review_required: true
  unverified_creator_execution_allowed: false
