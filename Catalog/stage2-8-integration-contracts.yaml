schema_version: "1.0"
scope: stage2_8_integration
status: implementation_complete_validation_pending
production_baseline_commit: c0c37669a1ee187022ff0664dfbf3f6d7c3da7fa
production_verified_tools: 45
integration_candidate_tools: 32
combined_target_tools: 77

shared_plan_contract:
  prepare_is_read_only: true
  expected_revision_required: true
  approval_token_required_when_mutating: true
  one_time_plan_required: true
  plan_expires: true
  automatic_save: prohibited
  automatic_full_bake: prohibited
  generic_serialized_property_mutation: prohibited
  silent_fallback: prohibited
  candidate_is_not_production_verified: true

modules:
  unity_profiler_mcp:
    status: integration_candidate
    tools: 8
    mutation_scope: capture_control_only
    target_device_claim_without_evidence: prohibited
    same_environment_baseline_required: true
    tools_surface:
      - profiler.inspect_environment
      - profiler.inspect_counters
      - profiler.prepare_capture
      - profiler.start_capture
      - profiler.get_capture_status
      - profiler.cancel_capture
      - profiler.summarize_capture
      - profiler.compare_baseline

  unity_addressables_mcp:
    status: integration_candidate
    kind: optional_domain
    tools: 4
    required_package: com.unity.addressables
    package_absent_result: UNSUPPORTED
    backend_compile_isolation: version_define
    automatic_settings_creation: prohibited
    automatic_group_creation: prohibited
    automatic_save: prohibited
    content_build: excluded_from_current_mcp_surface
    tools_surface:
      - addressables.inspect
      - addressables.prepare_entry
      - addressables.apply_entry
      - addressables.get_support_matrix

  unity_ui_mcp:
    status: integration_candidate
    tools: 5
    mutation_scope:
      - rect_transform
    mutation_requires_approval: true
    automatic_save: prohibited
    unrelated_component_mutation: prohibited

  unity_animation_mcp:
    status: integration_candidate
    tools: 5
    mutation_scope:
      - animator_controller_parameter
    mutation_requires_approval: true
    excluded_mutation:
      - state_machine_rewrite
      - transition_rewrite
      - animation_curve_rewrite
      - clip_event_mutation

  unity_audio_mcp:
    status: integration_candidate
    tools: 5
    mutation_scope:
      - volume
      - pitch
      - spatial_blend
      - loop
      - mute
      - play_on_awake
    mutation_requires_approval: true
    excluded_mutation:
      - audio_clip_replacement
      - audio_mixer_asset_creation

  unity_cinematic_mcp:
    status: integration_candidate
    tools: 5
    mutation_scope:
      - playable_director_initial_time
      - playable_director_update_mode
      - playable_director_wrap_mode
      - playable_director_play_on_awake
    mutation_requires_approval: true
    excluded_mutation:
      - playable_asset_replacement
      - timeline_track_creation
      - timeline_clip_creation
      - generic_binding_mutation
      - cinemachine_shot_mutation

validation_wave:
  status: reset_after_addressables_build_removal
  must_verify:
    - exact_77_tool_discovery
    - package_compile
    - each_domain_readonly_path
    - each_domain_safety_boundary
    - approval_and_stale_revision_rejection
    - mutation_scope_and_undo_or_recovery
    - agent_to_candidate_domain_routing
    - cross_domain_failure_propagation
  may_not_claim_before_validation:
    - production_operational
    - automated_ci_passed
    - target_device_verified
