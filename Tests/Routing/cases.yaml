version: 2
authority: UnityAgent semantic routing
cases:
  - id: ARTIST-ROUTE-001
    prompt: "夕暮れの中庭のLookDevを作り、光と霧を調整して比較したい。"
    expected_primary_route: artist-lookdev
    expected_capabilities:
      - project.inspect
      - domain.workflow
      - visual.capture
    expected_qualifiers:
      domain: visual_art
      workflows:
        - lookdev_refine
        - capture
    must_not_select_as_production_provider:
      - myunitymcp
    required_evidence:
      - visual_direction_plan
      - exact_diff
      - expected_revision
      - visual_capture

  - id: ARTIST-ROUTE-002
    prompt: "三つのCinemachine ShotとTimeline Markerを含む短いカットのPlanを作る。"
    expected_primary_route: artist-cinematic
    expected_capabilities:
      - project.inspect
      - domain.workflow
      - visual.capture
    expected_qualifiers:
      domain: cinematic
      workflows:
        - cinematic
        - capture
    must_not_select_as_production_provider:
      - myunitymcp
    required_evidence:
      - cinematic_plan
      - timeline_evidence
      - camera_binding

  - id: GENERIC-DELEGATION-001
    prompt: "このProjectをCompileしてTestする。"
    expected_primary_route: generic-planning
    expected_provider_family: unity_cli_or_native_editor
    must_not_route_to_artist_command:
      - compile
      - test
      - build
