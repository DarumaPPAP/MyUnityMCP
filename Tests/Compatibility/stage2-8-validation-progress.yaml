safety_findings:
  response_schema:
    original_observed_result: MCP_RESPONSE_SCHEMA_ERROR
    original_cause: MCPResponse.error returned object instead of string
    first_fix_status: partial
    manual_retest:
      pydantic_schema_error: false
      error_field_is_string: true
  stale_revision_precedence:
    tool: ui.prepare_rect_transform
    first_test_input:
      expected_revision: 0
      editor_revision: 1
      target_exists: false
    intended_result: STALE_REVISION
    observed_result_before_precedence_fix: NOT_FOUND
    observed_error: 対象RectTransformが見つかりません。
    mutation: false
    approval: false
    apply: false
    editor_revision_changed: false
    validation_stopped_safely: true
    cause: domain target resolution occurred before shared expectedRevision validation
  bridge_error_envelope:
    second_retest_input:
      expected_revision: 0
      editor_revision: 1
      target_object_id: ""
    observed_result_after_precedence_fix:
      success: false
      error: expectedRevisionが現在のEditor Revisionと一致しません。
      status_visible_to_client: false
      error_code_visible_to_client: false
      mutation: false
      approval: false
      apply: false
      editor_revision_changed: false
    root_cause: top-level error field causes MCP Bridge to emit an error envelope and drop normal result fields such as status and errorCode
  mcp_response_field_strip:
    third_retest_input:
      expected_revision: 0
      editor_revision: 1
      target_object_id: ""
    observed_result_after_error_field_removal:
      success: false
      message: null
      error: null
      data: null
      hint: null
      status_visible_to_client: false
      error_code_visible_to_client: false
      error_message_visible_to_client: false
    root_cause: MCP Server parses custom tool results into MCPResponse(success, message, error, data, hint); extra top-level fields are discarded by the Pydantic model

blocking_fix:
  status: implemented_awaiting_manual_retest
  current_candidate_fix:
    expected_revision_gate_location: UnityDomainMcpCommon.Execute
    behavior: expectedRevision is validated before delegated domain runtime target/input validation
    tool_identity: resolved from declaring MCP tool attribute
    applies_to: all MCP tool requests carrying expectedRevision
    stale_error_status_location: data.status
    stale_error_code_location: data.errorCode
  shared_domain_response:
    top_level_error_field: not_used_for_domain_metadata
    top_level_message_field: summary_human_message
    top_level_data_field: bridge_preserved_domain_metadata
    data_contains:
      - schemaVersion
      - tool
      - status
      - errorCode
      - errorMessage
      - summary
      - revision
      - success
    reason: MCPResponse only preserves success/message/error/data/hint at the Client boundary
    applies_to_all_stage2_8_domains: true
  agent_delegated_failure_compatibility:
    legacy_object_error_supported: true
    string_error_supported: true
    domain_error_code_preserved: true
    summary_fallback_supported: true
  regression_tests:
    response_contract:
      path: Packages/com.darumappap.my-unity-mcp/Tests/Editor/Development/UnityDomainMcpResponseContractTests.cs
      execution_status: not_run
      assertions:
        - top-level message is populated
        - top-level error is not used for structured metadata
        - data.status remains visible
        - data.errorCode remains visible
        - data.errorMessage remains visible
    revision_precedence:
      path: Packages/com.darumappap.my-unity-mcp/Tests/Editor/Development/UnityDomainRevisionPrecedenceTests.cs
      execution_status: not_run
      assertions:
        - stale revision wins over missing target
        - current revision preserves missing target response
        - editor revision remains unchanged

