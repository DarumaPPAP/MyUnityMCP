    observed_error: Unity plugin session disconnected while awaiting command_result
    observed_session_id: bee7c3c5-b7b8-48e9-bdc9-29bd049a0ccb
    build_started: unknown
    build_final_status: unknown
    history_available_after_failure: false
    editor_revision_after_failure: unknown
    scene_asset_state_after_failure: unknown
    validation_stopped_safely: true
    implementation_root_cause:
      status: strong_static_inference_requires_editor_retest
      detail: build.start_player called synchronous BuildPipeline.BuildPlayer inside the MCP command handler, so the Editor main thread could remain blocked while the transport waited for command_result and heartbeat activity

blocking_fix:
  status: implemented_awaiting_manual_retest
  build_transport_fix:
    implementation_commit: df8587b10340c49fc52c0b26394117ccfac293ad
    behavior:
      - approved plan is consumed synchronously
      - build.start_player creates a QUEUED build record
      - build.start_player returns PARTIAL before BuildPipeline.BuildPlayer starts
      - actual BuildPipeline.BuildPlayer starts from EditorApplication.update after the MCP command response handoff window
      - build.get_history exposes activeBuild, completed history, queuedBuild, and isBuildingPlayer
      - no background thread calls Unity APIs
      - running BuildPipeline.BuildPlayer remains non-cancellable through public API
    build_start_delay_seconds: 1.0
    expected_initial_response:
      status: PARTIAL
      build_state: QUEUED
      plan_consumed: true
      build_started: false
      command_result_returned_before_build: true
    transport_expectation:
      note: Unity may still become temporarily unavailable while synchronous BuildPipeline.BuildPlayer owns the Editor main thread; the required contract is that build.start_player command_result is delivered before that blocking call begins and final evidence is retrieved after the plugin becomes Ready again
  regression_tests:
    build_transport_contract:
      path: Packages/com.darumappap.my-unity-mcp/Tests/Editor/Development/UnityBuildMcpTransportContractTests.cs
      execution_status: not_run
      assertions:
        - approved plan is consumed
        - result is PARTIAL and successful
        - BuildPipeline is not active inside the MCP command handler
        - build state is QUEUED
        - commandResultReturnedBeforeBuild is true
        - buildStarted is false
    response_contract:
      path: Packages/com.darumappap.my-unity-mcp/Tests/Editor/Development/UnityDomainMcpResponseContractTests.cs
      execution_status: not_run
    revision_precedence:
