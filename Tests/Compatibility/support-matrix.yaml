  ci_verified_version: "6000.0.75f1"
  all_6000_patches_verified: false
  api_compatibility:
    source_of_truth: Packages/com.darumappap.my-unity-mcp/Editor/Compatibility/ApiCompatibility.cs
    maintenance_skill: skills/myunitymcp-unity-api-compatibility/SKILL.md
    maintenance_buckets:
      - BASE
      - UNITY_6000_4
      - UNITY_6000_5
      - UNITY_6000_7
    base_policy: modernize_when_replacement_is_available_without_waiting_for_deprecation
    unity_6000_4:
      rule_status: confirmed
      editor_ci: passed
      verified_version: "6000.4.12f1"
      evidence_artifact_id: 9090981750
    unity_6000_5:
      rule_status: confirmed
      editor_ci: passed
      verified_version: "6000.5.5f1"
      evidence_artifact_id: 9090985384
    unity_6000_6:
      patch_bucket: UNITY_6000_7
      rule_status: planned_or_confirmed_per_rule
      editor_ci: not_verified
    unity_6000_7:
      rule_status: planned_or_confirmed_per_rule
      editor_ci: manual_passed
      verified_version: "6000.7.0a2"
      manual_evidence:
        package_install: passed
        script_compile: passed
        v1_graphics_tool_discovery_32: passed
        graph_engineering_combined_tool_discovery_91: passed
        unity_agent_included_in_combined_discovery: true
        graphics_inspect_project: passed
        compatibility_buckets: passed
      automated_canary: gameci_image_unavailable
    package_versions_required_for_package_api_decisions: true

unity_agent:
  source_evidence:
    graph_modernization_run_52: passed
    unchanged_agent_source_carry_forward: accepted
    unity_6000_7_combined_discovery: passed
  direct_unity_mutation: prohibited
  operational_delegate_domains:
    - unity_graphics_mcp
  non_operational_domain_execution: rejected
  approval_groups: explicit
  expected_revision: required_for_compile_and_execution
  execution_timeout: cooperative_1_to_3600_seconds_default_60
  cancellation: cooperative_step_boundary
  automatic_resume_after_reload_or_disconnect: prohibited

pipelines:
  built_in:
    inspection_planning: supported
    graphics_mutation: supported
    volume_mutation: conditional_volume_api
    explicit_save: supported
    dependency_bake: conditional_explicit_backend
    capture_evidence: conditional_graphics_device
    apv_bake: unsupported
    visual_evaluation_refine: supported
  urp:
    inspection_planning: supported
    graphics_mutation: supported
    volume_mutation: conditional_volume_api
    explicit_save: supported
    dependency_bake: conditional_explicit_backend
    capture_evidence: conditional_graphics_device
    apv_bake: conditional_apv_backend
    visual_evaluation_refine: supported
  hdrp:
    inspection_planning: supported
    graphics_mutation: supported
    volume_mutation: conditional_volume_api
    explicit_save: supported
    dependency_bake: conditional_explicit_backend
    capture_evidence: conditional_graphics_device
    apv_bake: conditional_apv_backend
    visual_evaluation_refine: supported

execution_services:
  timeout: cooperative_1_to_3600_seconds_default_60
  cancellation: cooperative_native_backend_when_available
  progress: polling_and_jsonl_trace
  execution_history: 30_days_maximum_1000
  runtime_artifact_retention: 14_days
  ci_evidence_retention: 90_days
  automatic_resume_after_restart: prohibited

not_verified:
  - player_runtime_tool_execution
  - target_device_tool_execution
  - every_unity_6000_patch
  - unity_6000_6_editor_compile_for_new_compatibility_registry
  - every_render_pipeline_package_version
  - every_external_mcp_client_disconnect_callback
  - image_artifact_generation_in_null_graphics_batchmode
  - every_project_specific_apv_baking_set
  - exact_42_tool_production_ci_after_runner_recovery
