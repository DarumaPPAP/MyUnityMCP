schema_version: "1.0"
package_version: "1.0.0"

verification_contract:
  discovered_mcp_tools: 32
  minimum_editmode_contracts: 125
  fresh_project_sample_required: true
  canonical_end_to_end_required: true
  major_fault_injection_scene_safety_required: true

execution_surface:
  unity_editor: supported
  player_runtime: unsupported
  target_device: not_verified

unity:
  minimum_version: "6000.0"
  ci_verified_version: "6000.0.75f1"
  all_6000_patches_verified: false

pipelines:
  built_in:
    inspection_planning: supported
    graphics_mutation: supported
    volume_mutation: conditional_volume_api
    explicit_save: supported
    dependency_bake: conditional_explicit_backend
    capture_evidence: conditional_graphics_device
    apv_bake: unsupported
    visual_evaluation_refine: supported
  urp:
    inspection_planning: supported
    graphics_mutation: supported
    volume_mutation: conditional_volume_api
    explicit_save: supported
    dependency_bake: conditional_explicit_backend
    capture_evidence: conditional_graphics_device
    apv_bake: conditional_apv_backend
    visual_evaluation_refine: supported
  hdrp:
    inspection_planning: supported
    graphics_mutation: supported
    volume_mutation: conditional_volume_api
    explicit_save: supported
    dependency_bake: conditional_explicit_backend
    capture_evidence: conditional_graphics_device
    apv_bake: conditional_apv_backend
    visual_evaluation_refine: supported

execution_services:
  timeout: cooperative_1_to_3600_seconds_default_60
  cancellation: cooperative_native_backend_when_available
  progress: polling_and_jsonl_trace
  execution_history: 30_days_maximum_1000
  runtime_artifact_retention: 14_days
  ci_evidence_retention: 90_days
  automatic_resume_after_restart: prohibited

not_verified:
  - player_runtime_tool_execution
  - target_device_tool_execution
  - every_unity_6000_patch
  - every_render_pipeline_package_version
  - every_external_mcp_client_disconnect_callback
  - image_artifact_generation_in_null_graphics_batchmode
  - every_project_specific_apv_baking_set
