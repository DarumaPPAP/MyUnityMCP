schema_version: "1.1"
package_version: "1.1.0"
source_channel: main_v1_1_release_candidate

verification_contract:
  discovered_mcp_tools: 42
  production_graphics_tools: 32
  production_agent_tools: 10
  minimum_editmode_contracts: 125
  fresh_project_sample_required: true
  canonical_end_to_end_required: true
  major_fault_injection_scene_safety_required: true

operational_modules:
  unity_graphics_mcp: editor_operational
  unity_agent_mcp: editor_operational

execution_surface:
  unity_editor: supported
  player_runtime: unsupported
  target_device: not_verified

unity:
