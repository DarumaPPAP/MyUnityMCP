schema_version: "1.0"
package_version: "0.8.0"

execution_surface:
  unity_editor: supported
  player_runtime: unsupported
  target_device: not_verified

unity:
  minimum_version: "6000.0"
  ci_verified_version: "6000.0.75f1"
  all_6000_patches_verified: false

pipelines:
  built_in:
    inspection: supported
    planning: supported
    light_camera_reflection_probe_mutation: supported
    volume_mutation: unsupported_without_volume_api
    dependency_bake: conditional_explicit_backend
    capture_evidence: conditional_graphics_device
    apv_bake: unsupported
    visual_evaluation_refine: supported
  urp:
    inspection: supported
    planning: supported
    light_camera_reflection_probe_mutation: supported
    volume_mutation: conditional_volume_api
    dependency_bake: conditional_explicit_backend
    capture_evidence: conditional_graphics_device
    apv_bake: conditional_apv_backend
    visual_evaluation_refine: supported
  hdrp:
    inspection: supported
    planning: supported
    light_camera_reflection_probe_mutation: supported
    volume_mutation: conditional_volume_api
    dependency_bake: conditional_explicit_backend
    capture_evidence: conditional_graphics_device
    apv_bake: conditional_apv_backend
    visual_evaluation_refine: supported

execution_services:
  timeout:
    mode: cooperative
    default_seconds: 60
    minimum_seconds: 1
    maximum_seconds: 3600
  cancellation:
    mode: cooperative
    native_backend_cancel_when_available: true
  progress:
    polling_tool: graphics.get_execution_status
    trace_format: jsonl
  persistence:
    execution_history_days: 30
    maximum_history_records: 1000
    runtime_owned_artifact_days: 14
    ci_evidence_days: 90
  recovery:
    domain_reload: interrupted
    compile_started: interrupted
    play_mode_transition: interrupted
    scene_closed: interrupted
    multi_scene_configuration_changed: interrupted
    mcp_client_disconnected: adapter_callback_required
    unity_restart: recover_as_interrupted
    automatic_resume: prohibited

not_verified:
  - player_runtime_tool_execution
  - target_device_tool_execution
  - every_unity_6000_patch
  - every_render_pipeline_package_version
  - every_external_mcp_client_disconnect_callback
  - image_artifact_generation_in_null_graphics_batchmode
