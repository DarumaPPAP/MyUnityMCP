        exact_diff: true
        approval_token_issued: true
      graphics.prepare_bake_plan:
        status: implemented_editor_verified
        exact_dependency_set: true
        approval_token_issued: true

  mutate:
    mutation: true
    status: phase_3_editor_verified
    bridge_group: core
    auto_register: false
    activation: explicit
    explicit_approval_required: true
    tools:
      graphics.apply_plan:
        status: implemented_editor_verified
        supported_operations:
          - LIGHT_CREATE
          - LIGHT_UPDATE
      graphics.undo_last_transaction:
        status: implemented_editor_verified
      graphics.apply_environment_plan:
        status: implemented_editor_verified
        supported_operations:
          - CAMERA_CREATE
          - CAMERA_UPDATE
          - REFLECTION_PROBE_CREATE
          - REFLECTION_PROBE_UPDATE
          - VOLUME_CREATE
          - VOLUME_UPDATE
      graphics.undo_last_environment_transaction:
        status: implemented_editor_verified

  save:
    mutation: persistent_scene_write
    status: phase_4a_editor_verified
    bridge_group: core
    auto_register: false
    activation: explicit
    explicit_approval_required: true
    tools:
      graphics.apply_save_plan:
        status: implemented_editor_verified
        save_mode: EXPLICIT_SCENE
        save_as: prohibited
        automatic_rollback: false

  bake:
    mutation: true
    expensive: true
    status: phase_4b_editor_verified
    bridge_group: core
    auto_register: false
    activation: explicit
    explicit_approval_required: true
    prerequisites:
      - dirty_dependency_set
      - expected_revision
      - bake_plan
      - approval_token
      - exact_diff_digest
      - explicit_dependency_mode
    tools:
      graphics.bake_dependencies:
        status: implemented_editor_verified
        bake_mode: EXPLICIT_DEPENDENCIES
        synchronous: true
        automatic_save: false
        unity_undo: false
        automatic_rollback: false
        supported_dependencies:
          LIGHTMAP_SCENE:
            status: implemented_editor_verified
            full_loaded_scene_fallback: prohibited_when_multiple_scenes
          REFLECTION_PROBE:
            status: implemented_source_verified
            existing_cubemap_required: true
          ADAPTIVE_PROBE_VOLUME:
            status: backend_not_implemented
            requires:
              - baking_set_contract
              - lighting_scenario_contract
              - pipeline_package_backend

  capture:
    mutation: temporary_editor_state_and_library_evidence_write
    status: phase_4c_editor_verified
    bridge_group: core
    auto_register: false
    activation: explicit
    tools:
      graphics.capture_evaluation:
        status: implemented_editor_verified
        compatibility_api: true
        color_png_only: true
        temporary_state_restore: true
      graphics.refine_direction:
        status: implemented_editor_verified
        compatibility_api: true
        human_review_required: true
        visual_acceptance_automatic: false
      graphics.capture_evidence:
        status: implemented_editor_verified
        expected_revision_required: true
        atomic_bundle_publish: true
        evidence_digest: sha256
        channels:
          COLOR:
            format: PNG_RGBA32
            status: implemented_editor_verified
          LINEAR_DEPTH:
            format: EXR_FLOAT_R32
            status: implemented_editor_verified
          OBJECT_ID:
            format: PNG_RGB24
            status: implemented_editor_verified
            mapping_json: true
        manifest:
          camera_baseline: true
          scene_identity: true
          render_pipeline: true
          color_space: true
          artifact_sha256: true
          coverage_limitations: true
        state_restore:
          camera_target_texture: required_and_tested
          active_render_texture: required_and_tested
          scene_dirty: required_and_tested
          project_asset_dirty: required_and_tested
          undo_group: required_and_tested
        null_graphics_device: unverified_without_fake_output
        image_semantic_analysis: prohibited
      graphics.submit_visual_review:
        status: implemented_editor_verified
        evidence_digest_match_required: true
        human_reviewer_required: true
        immutable_once_submitted: true
        decisions:
          - ACCEPTED
          - REJECTED
          - NEEDS_ADJUSTMENT
        accepted_confirmation: VISUAL_ACCEPTED
        automatic_acceptance: prohibited
      graphics.refine_from_visual_review:
        status: implemented_editor_verified
        read_only: true
        accepted_review_refine: prohibited
        supported_decisions:
          - REJECTED
          - NEEDS_ADJUSTMENT

