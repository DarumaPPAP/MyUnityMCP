schema_version: "2.2"
package_id: com.darumappap.my-unity-mcp
version: "1.1.0"
implementation_status: stage2_8_implementation_complete_validation_pending
release_baseline: v1.0.0
production_baseline_commit: c0c37669a1ee187022ff0664dfbf3f6d7c3da7fa
production_verified_tool_count: 45
integration_target_tool_count: 79

operational_domain:
  id: unity_graphics_mcp
  status: editor_operational
  specification: ../../Specs/UnityGraphicsMCP/spec.md
  architecture: ../../Specs/UnityGraphicsMCP/architecture.md
  support_matrix: ../../Tests/Compatibility/support-matrix.yaml

operational_control_plane:
  id: unity_agent_mcp
  status: editor_operational
  runtime_catalog: Editor/Development/Agent/UnityAgentMcpCatalog.json
  capability_contract: ../../Catalog/unity-agent-capability-contracts.yaml
  direct_unity_mutation_allowed: false

operational_creator:
  id: world_creator
  status: editor_operational
  specification: ../../Specs/UnityWorldCreatorMCP/spec.md
  capability_contract: ../../Catalog/world-creator-capability-contract.yaml
  direct_unity_mutation_allowed: false
  orchestration_control_plane: unity_agent_mcp

integration_candidate_domains:
  - id: unity_profiler_mcp
    status: integration_candidate
    tools: 8
    mutation_scope: capture_control_only
  - id: unity_addressables_mcp
    status: integration_candidate
    tools: 6
    optional_package: com.unity.addressables
  - id: unity_ui_mcp
    status: integration_candidate
    tools: 5
    approval_required_for_mutation: true
  - id: unity_animation_mcp
    status: integration_candidate
    tools: 5
    approval_required_for_mutation: true
  - id: unity_audio_mcp
    status: integration_candidate
    tools: 5
    approval_required_for_mutation: true
  - id: unity_cinematic_mcp
    status: integration_candidate
    tools: 5
    approval_required_for_mutation: true

bridge:
  package: com.coplaydev.unity-mcp
  declared_api_version: "10.1.2"
  command_entry: HandleCommand(JObject)
  command_dispatch: unity_main_thread
  discovered_tool_count: 79
  tools_enabled_by_default: false
  explicit_activation_required: true

production_tool_groups:
  graphics:
    tools: 32
  agent:
    tools: 10
  world_creator:
    tools: 3

integration_tool_groups:
  profiler:
    mutation: false
    tools:
      - profiler.inspect_environment
      - profiler.inspect_counters
      - profiler.prepare_capture
      - profiler.start_capture
      - profiler.get_capture_status
      - profiler.cancel_capture
      - profiler.summarize_capture
      - profiler.compare_baseline
  addressables:
    mutation: asset_and_content_build
    tools:
      - addressables.inspect
      - addressables.prepare_entry
      - addressables.apply_entry
      - addressables.prepare_content_build
      - addressables.build_content
      - addressables.get_support_matrix
  ui:
    mutation: scene_rect_transform
    tools:
      - ui.inspect
      - ui.validate
      - ui.prepare_rect_transform
      - ui.apply_rect_transform
      - ui.get_support_matrix
  animation:
    mutation: animator_controller_parameter
    tools:
      - animation.inspect
      - animation.validate
      - animation.prepare_parameter
      - animation.apply_parameter
      - animation.get_support_matrix
  audio:
    mutation: scene_audio_source
    tools:
      - audio.inspect
      - audio.validate
      - audio.prepare_source
      - audio.apply_source
      - audio.get_support_matrix
  cinematic:
    mutation: scene_playable_director
    tools:
      - cinematic.inspect
      - cinematic.validate
      - cinematic.prepare_director
      - cinematic.apply_director
      - cinematic.get_support_matrix

safety:
  read_only_prepare: true
  expected_revision_required_for_mutation: true
  approval_token_required_for_mutation: true
  one_time_plan_required: true
  automatic_save: prohibited
  automatic_full_bake: prohibited
  generic_serialized_property_mutation: prohibited
  silent_fallback: prohibited
  automatic_visual_acceptance: prohibited
  automatic_execution_resume_after_restart: prohibited
  control_plane_direct_mutation: prohibited
  creator_direct_mutation: prohibited
  integration_candidate_is_not_production_verified: true

verification:
  release_baseline_evidence: ../../Tests/Compatibility/release-verification.yaml
  stage_0_evidence: ../../Tests/Compatibility/stage-0-production-baseline-verification.yaml
  world_creator_evidence: ../../Tests/Compatibility/world-creator-production-promotion-verification.yaml
  current_support_matrix: ../../Tests/Compatibility/support-matrix.yaml
  unity_editor_compile: required
  tool_discovery_count: 79
  production_verified_tool_count: 45
  integration_candidate_tool_count: 34
  stage2_8_validation_status: reset_after_build_domain_removal
  fresh_project_sample_workflow: required
  combined_domain_e2e: required_after_implementation_complete

not_production_operational_until_validation:
  - unity_profiler_mcp
  - unity_addressables_mcp
  - unity_ui_mcp
  - unity_animation_mcp
  - unity_audio_mcp
  - unity_cinematic_mcp

not_implemented_in_stage2_8:
  - movie_creator_runtime
  - live_creator_runtime
