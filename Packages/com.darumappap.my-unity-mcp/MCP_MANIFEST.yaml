schema_version: "1.4"
package_id: com.darumappap.my-unity-mcp
version: "0.3.0"
implementation_status: phase_3a_light_mutation_complete
verified_level: unity_editor_ci

control_plane:
  id: unity_agent_mcp
  status: specified
  implementation_status: not_started
  specification: ../../Specs/UnityAgentMCP/spec.md

registered_domains:
  - id: unity_graphics_mcp
    status: phase_3a_editor_operational
    implementation_status: inspect_plan_and_light_mutation_verified
    specification: ../../Specs/UnityGraphicsMCP/spec.md
    plan: ../../Specs/UnityGraphicsMCP/plan.md
    tasks: ../../Specs/UnityGraphicsMCP/tasks.md
    editor_tool_design: ../../Specs/UnityGraphicsMCP/editor-tool-design.md

planned_domains:
  - unity_cinematic_mcp
  - unity_ui_mcp
  - unity_addressables_mcp
  - unity_animation_mcp
  - unity_audio_mcp
  - unity_profiler_mcp
  - unity_build_mcp

creator_workflows:
  - id: live_creator
    status: specified_not_executable
    path: ../../Workflows/LiveCreator.yaml
    blocked_by:
      - unity_cinematic_mcp_not_implemented
      - graphics_mutation_scope_is_light_only
  - id: movie_creator
    status: specified_not_executable
    path: ../../Workflows/MovieCreator.yaml
    blocked_by:
      - unity_cinematic_mcp_not_implemented
      - graphics_mutation_scope_is_light_only

tool_groups:
  inspect:
    mutation: false
    status: implemented_editor_verified
    bridge_group: core
    auto_register: false
    activation: explicit
    tools:
      graphics.inspect_project:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpTools.cs
      graphics.inspect_scene:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpTools.cs
        snapshot_paging: true
      graphics.validate_scene:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpTools.cs
      graphics.inspect_frame:
        status: planned

  plan:
    mutation: false
    status: implemented_editor_verified
    bridge_group: core
    auto_register: false
    activation: explicit
    tools:
      graphics.compile_direction:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpTools.cs
      graphics.preview_plan:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpTools.cs
      graphics.prepare_light_plan:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpTools.cs
        exact_diff: true
        approval_token_issued: true

  mutate:
    mutation: true
    status: phase_3a_light_only_editor_verified
    bridge_group: core
    auto_register: false
    activation: explicit
    explicit_approval_required: true
    prerequisites:
      - direction_plan
      - executable_light_plan
      - expected_revision
      - approval_token
      - exact_diff_digest
      - save_mode_none
    tools:
      graphics.apply_plan:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpTools.cs
        supported_operations:
          - LIGHT_CREATE
          - LIGHT_UPDATE
        supported_light_types:
          - Directional
          - Point
          - Spot
      graphics.undo_last_transaction:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpTools.cs
        latest_transaction_only: true
        external_change_rejection: true

  bake:
    mutation: true
    expensive: true
    status: planned
    explicit_approval_required: true
    prerequisites:
      - dirty_dependency_set
    tools:
      - graphics.bake_dependencies

  capture:
    mutation: temporary_editor_state
    status: planned
    tools:
      - graphics.capture_evaluation
      - graphics.refine_direction

bridge:
  package: com.coplaydev.unity-mcp
  declared_api_version: "10.1.2"
  unity_verified_commit: 9f84072c38906e3ca903f14f6a8edc1a1c9012c3
  tool_attribute: MCPForUnity.Editor.Tools.McpForUnityToolAttribute
  command_entry: HandleCommand(JObject)
  response_contract:
    - SuccessResponse
    - ErrorResponse
  command_dispatch: unity_main_thread
  compile_verified: true
  command_registry_discovery_verified: true
  direct_handler_invocation_verified: true
  external_mcp_client_connection_verified: false

availability:
  source_is_implemented: true
  package_is_executable: true
  operational_scope: phase_3a_editor_tools
  tools_enabled_by_default: false
  expose_unimplemented_tools: false
  expose_selected_tool_group_only: true
  load_package_source_during_normal_use: false
  explicit_activation_required: true
  completed_operational_gates:
    - package_dependency_resolution
    - unity_editor_compile
    - editmode_tests
    - bridge_tool_discovery
    - direct_bridge_handler_invocation
    - scene_dirty_guard
    - persistent_asset_dirty_guard
    - material_instance_guard
    - direction_plan_revision_guard
    - exact_light_diff_preview
    - approval_token_guard
    - mutation_rollback
    - atomic_undo
    - no_auto_save
    - no_bake

environment_resolution:
  source_of_truth: target_unity_project
  inspect_before_backend_selection: true
  fixed_default_environment: prohibited
  required_facts:
    - unity_version
    - render_pipeline_kind
    - render_pipeline_package_version
    - active_renderer
    - rendering_path
    - render_graph_mode
    - active_build_target
    - installed_build_targets
    - graphics_apis
    - scripting_backend
    - relevant_package_capabilities
  precedence:
    - detected_target_project_facts
    - explicit_request_targets_and_constraints
    - project_specific_profile
    - unity_agent_default_preferences
  unknown_fact_policy:
    assume_default: false
    return_unresolved_capability: true
    block_native_api_selection_when_required: true

backend_selection:
  select_after_project_inspection: true
  current_inspection_strategy: pipeline_agnostic_plus_serialized_capability_detection
  current_mutation_scope: pipeline_independent_unityengine_light
  load_only_selected_implemented_backend: true
  silent_fallback: prohibited
  backend_interface_requires_multiple_real_implementations: true

capability_status:
  values:
    - AVAILABLE
    - UNAVAILABLE
    - UNSUPPORTED
    - UNVERIFIED
    - PACKAGE_NOT_INSTALLED
    - VERSION_NOT_SUPPORTED
    - PROJECT_CONFIGURATION_REQUIRED
    - BACKEND_NOT_IMPLEMENTED
  unverified_is_not_unsupported: true

verification:
  matrix_path: ../../Tests/Compatibility/verification-matrix.yaml
  verified_environment_is_evidence_not_global_support_contract: true
  current_gates:
    static_source_review: passed
    package_dependency_resolution: passed
    unity_editor_compile: passed
    editmode: passed_30_of_30
    bridge_discovery: passed
    direct_handler_invocation: passed
    light_create: passed
    light_update: passed
    approval_rejection: passed
    stale_revision_rejection: passed
    rollback_contract: passed
    atomic_undo: passed
    external_change_undo_rejection: passed
    automatic_save: prohibited_and_tested
    bake: not_implemented_and_not_invoked
    player: not_required_for_editor_only_phase_3a
    target_device: not_required_for_editor_only_phase_3a
  evidence_source:
    kind: compatibility_matrix
    verification_id: MUMCP-PHASE3A-CI-20260804-001

safety:
  inspect_must_not_dirty_unity_state: true
  plan_must_not_dirty_unity_state: true
  renderer_material_instance_creation: prohibited
  volume_profile_instantiation: prohibited
  mutation_requires_exact_preview: true
  mutation_requires_approval_token: true
  mutation_requires_expected_revision: true
  mutation_is_single_undo_transaction: true
  exception_rolls_back_undo_group: true
  automatic_save: prohibited
  automatic_full_bake: prohibited
  silent_fallback: prohibited
  visual_acceptance_requires_human_review: true
