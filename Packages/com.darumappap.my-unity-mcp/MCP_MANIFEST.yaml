schema_version: "1.2"
package_id: com.darumappap.my-unity-mcp
version: "0.2.0"
implementation_status: phase_1_read_only_source_complete
verified_level: static_review_only

control_plane:
  id: unity_agent_mcp
  status: specified
  implementation_status: not_started
  specification: ../../Specs/UnityAgentMCP/spec.md

registered_domains:
  - id: unity_graphics_mcp
    status: phase_1_source_complete_unverified
    implementation_status: read_only_source_complete_unverified
    specification: ../../Specs/UnityGraphicsMCP/spec.md
    plan: ../../Specs/UnityGraphicsMCP/plan.md
    tasks: ../../Specs/UnityGraphicsMCP/tasks.md
    editor_tool_design: ../../Specs/UnityGraphicsMCP/editor-tool-design.md

planned_domains:
  - unity_cinematic_mcp
  - unity_ui_mcp
  - unity_addressables_mcp
  - unity_animation_mcp
  - unity_audio_mcp
  - unity_profiler_mcp
  - unity_build_mcp

creator_workflows:
  - id: live_creator
    status: specified_not_executable
    path: ../../Workflows/LiveCreator.yaml
    blocked_by:
      - unity_graphics_mcp_unverified
      - unity_cinematic_mcp_not_implemented
  - id: movie_creator
    status: specified_not_executable
    path: ../../Workflows/MovieCreator.yaml
    blocked_by:
      - unity_graphics_mcp_unverified
      - unity_cinematic_mcp_not_implemented

tool_groups:
  inspect:
    mutation: false
    status: source_complete_unverified
    bridge_group: core
    auto_register: false
    activation: explicit_after_verification
    tools:
      graphics.inspect_project:
        status: source_complete_unverified
        source: Editor/UnityGraphicsMcpTools.cs
      graphics.inspect_scene:
        status: source_complete_unverified
        source: Editor/UnityGraphicsMcpTools.cs
        snapshot_paging: true
      graphics.validate_scene:
        status: source_complete_unverified
        source: Editor/UnityGraphicsMcpTools.cs
      graphics.inspect_frame:
        status: planned

  plan:
    mutation: false
    status: planned
    tools:
      - graphics.compile_direction
      - graphics.preview_plan

  mutate:
    mutation: true
    status: planned
    explicit_approval_required: true
    prerequisites:
      - approved_plan
      - expected_revision
      - diff
      - undo_contract
    tools:
      - graphics.apply_plan
      - graphics.undo_transaction

  bake:
    mutation: true
    expensive: true
    status: planned
    explicit_approval_required: true
    prerequisites:
      - dirty_dependency_set
    tools:
      - graphics.bake_dependencies

  capture:
    mutation: temporary_editor_state
    status: planned
    tools:
      - graphics.capture_evaluation
      - graphics.refine_direction

bridge:
  package: com.coplaydev.unity-mcp
  source_api_verified_against: "10.1.2"
  tool_attribute: MCPForUnity.Editor.Tools.McpForUnityToolAttribute
  command_entry: HandleCommand(JObject)
  response_contract:
    - SuccessResponse
    - ErrorResponse
  command_dispatch: unity_main_thread
  compile_verified: false
  runtime_connection_verified: false

availability:
  source_is_implemented: true
  package_is_executable: unverified
  phase_1_tools_enabled_by_default: false
  expose_unimplemented_tools: false
  expose_selected_tool_group_only: true
  load_package_source_during_normal_use: false
  required_before_operational_claim:
    - unity_editor_compile
    - editmode_tests
    - bridge_tool_discovery
    - read_only_dirty_guard

environment_resolution:
  source_of_truth: target_unity_project
  inspect_before_backend_selection: true
  fixed_default_environment: prohibited

  required_facts:
    - unity_version
    - render_pipeline_kind
    - render_pipeline_package_version
    - active_renderer
    - rendering_path
    - render_graph_mode
    - active_build_target
    - installed_build_targets
    - graphics_apis
    - scripting_backend
    - relevant_package_capabilities

  precedence:
    - detected_target_project_facts
    - explicit_request_targets_and_constraints
    - project_specific_profile
    - unity_agent_default_preferences

  unknown_fact_policy:
    assume_default: false
    return_unresolved_capability: true
    block_native_api_selection_when_required: true

backend_selection:
  select_after_project_inspection: true
  current_read_only_inspection_strategy: pipeline_agnostic_plus_serialized_capability_detection
  load_only_selected_implemented_backend: true
  silent_fallback: prohibited
  backend_interface_requires_multiple_real_implementations: true

capability_status:
  values:
    - AVAILABLE
    - UNAVAILABLE
    - UNSUPPORTED
    - UNVERIFIED
    - PACKAGE_NOT_INSTALLED
    - VERSION_NOT_SUPPORTED
    - PROJECT_CONFIGURATION_REQUIRED
    - BACKEND_NOT_IMPLEMENTED
  unverified_is_not_unsupported: true

verification:
  matrix_path: ../../Tests/Compatibility/verification-matrix.yaml
  verified_environment_is_evidence_not_global_support_contract: true
  empty_matrix_means_not_verified: true
  current_gates:
    static_source_review: in_progress
    unity_editor_compile: not_run
    editmode: not_run
    bridge_discovery: not_run
    player: not_run
    target_device: not_run

safety:
  inspect_must_not_dirty_unity_state: true
  renderer_material_instance_creation: prohibited
  volume_profile_instantiation: prohibited
  automatic_save: prohibited
  automatic_full_bake: prohibited
  silent_fallback: prohibited
  visual_acceptance_requires_human_review: true
