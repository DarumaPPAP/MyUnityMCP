schema_version: "2.1"
package_id: com.darumappap.my-unity-mcp
version: "1.1.0"
implementation_status: main_release_candidate
release_baseline: v1.0.0
verified_level: unity_editor_ci_plus_manual_6000_7

operational_domain:
  id: unity_graphics_mcp
  status: editor_operational
  specification: ../../Specs/UnityGraphicsMCP/spec.md
  architecture: ../../Specs/UnityGraphicsMCP/architecture.md
  support_matrix: ../../Tests/Compatibility/support-matrix.yaml

operational_control_plane:
  id: unity_agent_mcp
  status: editor_operational
  runtime_catalog: Editor/Development/Agent/UnityAgentMcpCatalog.json
  capability_contract: ../../Catalog/unity-agent-capability-contracts.yaml
  direct_unity_mutation_allowed: false
  operational_delegate_domains:
    - unity_graphics_mcp

bridge:
  package: com.coplaydev.unity-mcp
  declared_api_version: "10.1.2"
  command_entry: HandleCommand(JObject)
  command_dispatch: unity_main_thread
  discovered_tool_count: 42
  tools_enabled_by_default: false
  explicit_activation_required: true
  external_mcp_client_connection_verified: true

tool_groups:
  inspect:
    mutation: false
    tools:
      - graphics.inspect_project
      - graphics.inspect_scene
      - graphics.validate_scene
  plan:
    mutation: false
    tools:
      - graphics.compile_direction
      - graphics.preview_plan
      - graphics.prepare_light_plan
      - graphics.prepare_environment_plan
      - graphics.prepare_save_plan
      - graphics.prepare_bake_plan
      - graphics.prepare_apv_bake_plan
      - graphics.prepare_acceptance_profile
  mutate:
    mutation: true
    approval_required: true
    tools:
      - graphics.apply_plan
      - graphics.undo_last_transaction
      - graphics.apply_environment_plan
      - graphics.undo_last_environment_transaction
  save:
    mutation: persistent_scene_write
    approval_required: true
    tools:
      - graphics.apply_save_plan
  bake:
    mutation: persistent_asset_write
    approval_required: true
    tools:
      - graphics.bake_dependencies
      - graphics.start_apv_bake
      - graphics.get_apv_bake_status
      - graphics.cancel_apv_bake
  capture:
    mutation: temporary_editor_state_and_library_write
    tools:
      - graphics.capture_evaluation
      - graphics.capture_evidence
  evaluate_and_refine:
    mutation: false
    tools:
      - graphics.refine_direction
      - graphics.submit_visual_review
      - graphics.refine_from_visual_review
      - graphics.evaluate_capture
      - graphics.refine_from_evaluation
  execution:
    mutation: execution_control
    tools:
      - graphics.get_execution_status
      - graphics.cancel_execution
      - graphics.get_execution_history
      - graphics.get_error_catalog
      - graphics.get_support_matrix
  agent:
    mutation: control_plane_only
    direct_unity_mutation: false
    tools:
      - agent.inspect_capabilities
      - agent.validate_workflow
      - agent.compile_graph
      - agent.preview_execution
      - agent.submit_approval
      - agent.start_execution
      - agent.get_execution_status
      - agent.cancel_execution
      - agent.get_execution_history
      - agent.get_error_catalog

safety:
  read_only_prepare: true
  exact_preview_required: true
  expected_revision_required_for_mutation: true
  approval_token_required_for_mutation: true
  automatic_save: prohibited
  automatic_full_bake: prohibited
  generic_serialized_property_mutation: prohibited
  silent_fallback: prohibited
  automatic_visual_acceptance: prohibited
  human_review_required_for_visual_acceptance: true
  automatic_execution_resume_after_restart: prohibited
  control_plane_direct_mutation: prohibited

verification:
  release_baseline_evidence: ../../Tests/Compatibility/release-verification.yaml
  current_support_matrix: ../../Tests/Compatibility/support-matrix.yaml
  historical_evidence_index: ../../Tests/Compatibility/README.md
  unity_editor_compile: required
  tool_discovery_count: 42
  minimum_editmode_contracts: 125
  fresh_project_sample_workflow: required

not_operational_current_main:
  - live_creator_runtime
  - movie_creator_runtime
  - unity_cinematic_mcp
  - unity_ui_mcp
  - unity_addressables_mcp
  - unity_animation_mcp
  - unity_audio_mcp
  - unity_profiler_mcp
  - unity_build_mcp
