    direct_unity_mutation: false
    tool_count: 10
  world_creator:
    kind: creator
    status: implementation_in_progress_unverified
    direct_unity_mutation: false
    tool_count: 3
  unity_profiler_mcp:
    kind: domain
    status: implementation_in_progress_unverified
    tool_count: 8
  unity_build_mcp:
    kind: domain
    status: implementation_in_progress_unverified
    tool_count: 6
  unity_addressables_mcp:
    kind: optional_domain
    status: implementation_in_progress_unverified
    package: com.unity.addressables
    tool_count: 6
  unity_ui_mcp:
    kind: domain
    status: implementation_in_progress_unverified
    tool_count: 5
  unity_animation_mcp:
    kind: domain
    status: implementation_in_progress_unverified
    tool_count: 5
  unity_audio_mcp:
    kind: domain
    status: implementation_in_progress_unverified
    tool_count: 5
  unity_cinematic_mcp:
    kind: domain
    status: implementation_in_progress_unverified
    tool_count: 5
  movie_creator:
    kind: creator
    status: implementation_in_progress_unverified
    direct_unity_mutation: false
    tool_count: 3
  live_creator:
    kind: creator
    status: implementation_in_progress_unverified
    direct_unity_mutation: false
    unattended_execution: prohibited
    tool_count: 3
  security_modes:
    kind: shared_policy
    status: implementation_in_progress_unverified
    modes:
      - PERSONAL
      - TEAM
      - RESTRICTED
      - CI
    forbidden_collection:
      - credentials
      - authentication_tokens
      - unity_project_id
      - organization_information
      - customer_names
      - internal_issue_numbers
      - private_screenshots
      - operational_information

bridge:
  package: com.coplaydev.unity-mcp
  declared_api_version: "10.1.2"
  command_entry: HandleCommand(JObject)
  command_dispatch: unity_main_thread
  verified_release_tool_count: 32
  development_candidate_tool_count: 91
  tools_enabled_by_default: false
  explicit_activation_required: true
  external_mcp_client_connection_verified: false

tool_groups:
  agent:
    mutation: delegated_only
    approval_required_for_side_effect_groups: true
    tools:
      - agent.inspect_capabilities
      - agent.validate_workflow
      - agent.compile_graph
      - agent.preview_execution
      - agent.submit_approval
      - agent.start_execution
      - agent.get_execution_status
      - agent.cancel_execution
      - agent.get_execution_history
      - agent.get_error_catalog
  graphics:
    status: editor_operational
    tool_count: 32
  creator:
    mutation: delegated_only
    human_review_required: true
    tools:
      - world.compile_workflow
      - world.start_preflight
      - world.create_review_handoff
      - movie.compile_production
      - movie.preview_production
      - movie.create_review_handoff
      - live.compile_show
      - live.preview_show
      - live.create_operator_handoff
  profiler:
    mutation: library_only_capture_state
    tools:
      - profiler.inspect_environment
      - profiler.inspect_counters
      - profiler.prepare_capture
      - profiler.start_capture
      - profiler.get_capture_status
      - profiler.cancel_capture
      - profiler.summarize_capture
      - profiler.compare_baseline
  build:
    mutation: persistent_build_output
    approval_required: true
    tools:
      - build.inspect_environment
      - build.prepare_player
      - build.start_player
      - build.get_history
      - build.cancel_player
      - build.get_support_matrix
  addressables:
    mutation: settings_or_content_output
    approval_required: true
    optional_package: true
    tools:
      - addressables.inspect
      - addressables.prepare_entry
      - addressables.apply_entry
      - addressables.prepare_content_build
      - addressables.build_content
      - addressables.get_support_matrix
  ui:
    mutation: scene_component
    approval_required: true
    tools:
      - ui.inspect
      - ui.validate
      - ui.prepare_rect_transform
      - ui.apply_rect_transform
      - ui.get_support_matrix
  animation:
    mutation: controller_asset
    approval_required: true
    tools:
      - animation.inspect
      - animation.validate
      - animation.prepare_parameter
      - animation.apply_parameter
      - animation.get_support_matrix
  audio:
    mutation: scene_component
    approval_required: true
    tools:
      - audio.inspect
      - audio.validate
      - audio.prepare_source
      - audio.apply_source
      - audio.get_support_matrix
  cinematic:
    mutation: scene_component
    approval_required: true
    tools:
      - cinematic.inspect
      - cinematic.validate
      - cinematic.prepare_director
      - cinematic.apply_director
      - cinematic.get_support_matrix

safety:
  read_only_prepare: true
  exact_preview_required: true
  expected_revision_required_for_mutation: true
  approval_token_required_for_mutation: true
  one_time_plan_consumption: true
  plan_expiration_minutes: 10
  control_plane_direct_mutation: prohibited
  creator_direct_mutation: prohibited
  automatic_save: prohibited
  automatic_full_bake: prohibited
  generic_serialized_property_mutation: prohibited
  reflection_in_development_modules: prohibited
  silent_fallback: prohibited
  automatic_visual_acceptance: prohibited
  human_review_required_for_visual_acceptance: true
  automatic_execution_resume_after_restart: prohibited
  live_unattended_execution: prohibited
  published_tag_move: prohibited
  team_mode_sensitive_collection: prohibited

verification:
  current_release_evidence: ../../Tests/Compatibility/release-verification.yaml
  historical_evidence_index: ../../Tests/Compatibility/README.md
  unity_editor_compile_for_development_modules: pending
  development_agent_contract_tests: 10
  development_domain_contract_tests_minimum: 8
  development_creator_contract_tests: 5
  development_security_contract_tests: 5
  development_fault_injection_tests: 5
  development_contract_test_total_minimum: 33
  development_expected_editmode_total_minimum: 158
  development_expected_editmode_total_without_addressables: 159
  verified_graphics_tool_discovery_count: 32
  development_candidate_tool_discovery_count: 91
  verified_graphics_minimum_editmode_contracts: 125
  fresh_project_sample_workflow: required

not_operational_in_v1:
  - unity_agent_mcp_runtime
  - world_creator_runtime
  - live_creator_runtime
  - movie_creator_runtime
  - unity_cinematic_mcp
  - unity_ui_mcp
  - unity_addressables_mcp
  - unity_animation_mcp
  - unity_audio_mcp
  - unity_profiler_mcp
  - unity_build_mcp
