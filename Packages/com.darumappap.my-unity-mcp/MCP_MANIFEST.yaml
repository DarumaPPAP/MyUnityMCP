tool_groups:
  inspect:
    mutation: false
    status: implemented_editor_verified
    bridge_group: core
    auto_register: false
    activation: explicit
    tools:
      graphics.inspect_project:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpInspection.cs
      graphics.inspect_scene:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpInspection.cs
        snapshot_paging: true
      graphics.validate_scene:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpInspection.cs
      graphics.inspect_frame:
        status: planned

  plan:
    mutation: false
    status: implemented_editor_verified
    bridge_group: core
    auto_register: false
    activation: explicit
    tools:
      graphics.compile_direction:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpPlanning.cs
      graphics.preview_plan:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpPlanning.cs
      graphics.prepare_light_plan:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpMutation.cs
        exact_diff: true
        approval_token_issued: true
      graphics.prepare_environment_plan:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpEnvironmentMutation.cs
        exact_diff: true
        approval_token_issued: true
        supported_operations:
          - CAMERA_CREATE
          - CAMERA_UPDATE
          - REFLECTION_PROBE_CREATE
          - REFLECTION_PROBE_UPDATE
          - VOLUME_CREATE
          - VOLUME_UPDATE

  mutate:
    mutation: true
    status: phase_3_editor_verified
    bridge_group: core
    auto_register: false
    activation: explicit
    explicit_approval_required: true
    prerequisites:
      - direction_plan
      - executable_capability_plan
      - expected_revision
      - approval_token
      - exact_diff_digest
      - save_mode_none
    tools:
      graphics.apply_plan:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpMutation.cs
        supported_operations:
          - LIGHT_CREATE
          - LIGHT_UPDATE
      graphics.undo_last_transaction:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpMutation.cs
        latest_transaction_only: true
        external_change_rejection: true
      graphics.apply_environment_plan:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpEnvironmentMutation.cs
        atomic_multi_component_transaction: true
      graphics.undo_last_environment_transaction:
        status: implemented_editor_verified
        source: Editor/UnityGraphicsMcpEnvironmentMutation.cs
        latest_transaction_only: true
        external_change_rejection: true
        newer_undo_group_rejection: true

  bake:
    mutation: true
    expensive: true
    status: planned_phase_4
    explicit_approval_required: true
    prerequisites:
      - dirty_dependency_set
    tools:
      - graphics.bake_dependencies

  capture:
    mutation: temporary_editor_state
    status: planned_phase_4
    tools:
      - graphics.capture_evaluation
      - graphics.refine_direction

bridge:
  package: com.coplaydev.unity-mcp
  declared_api_version: "10.1.2"
  unity_verified_commit: 9f84072c38906e3ca903f14f6a8edc1a1c9012c3
  tool_attribute: MCPForUnity.Editor.Tools.McpForUnityToolAttribute
  command_entry: HandleCommand(JObject)
  response_contract:
    - SuccessResponse
    - ErrorResponse
  command_dispatch: unity_main_thread
  compile_verified: true
  command_registry_discovery_verified: true
  discovered_tool_count: 11
  direct_handler_invocation_verified: true
  external_mcp_client_connection_verified: false

availability:
  source_is_implemented: true
  package_is_executable: true
  operational_scope: phase_3_editor_tools
  tools_enabled_by_default: false
  expose_unimplemented_tools: false
  expose_selected_tool_group_only: true
  load_package_source_during_normal_use: false
  explicit_activation_required: true
  completed_operational_gates:
    - package_dependency_resolution
    - unity_editor_compile
    - editmode_tests
    - eleven_tool_bridge_discovery
    - direct_bridge_handler_invocation
    - scene_dirty_guard
    - persistent_asset_dirty_guard
    - material_instance_guard
    - direction_plan_revision_guard
    - exact_diff_preview
    - approval_token_guard
    - mutation_rollback
    - atomic_undo
    - duplicate_operation_rejection
    - duplicate_update_target_rejection
    - volume_property_field_resolution
    - external_change_undo_rejection
    - newer_undo_group_rejection
    - no_auto_save
    - no_bake

environment_resolution:
  source_of_truth: target_unity_project
  inspect_before_backend_selection: true
  fixed_default_environment: prohibited
  required_facts:
    - unity_version
    - render_pipeline_kind
    - render_pipeline_package_version
    - active_renderer
    - rendering_path
    - render_graph_mode
    - active_build_target
    - installed_build_targets
    - graphics_apis
    - scripting_backend
    - relevant_package_capabilities
  precedence:
    - detected_target_project_facts
    - explicit_request_targets_and_constraints
    - project_specific_profile
    - unity_agent_default_preferences
  unknown_fact_policy:
    assume_default: false
    return_unresolved_capability: true
    block_native_api_selection_when_required: true

backend_selection:
  select_after_project_inspection: true
  current_inspection_strategy: pipeline_agnostic_plus_serialized_capability_detection
  current_mutation_scope:
    - pipeline_independent_light
    - pipeline_independent_camera
    - pipeline_independent_reflection_probe
    - optional_render_pipelines_core_volume
  render_pipelines_core_dependency: optional_target_project_capability
  load_only_selected_implemented_backend: true
  silent_fallback: prohibited
  backend_interface_requires_multiple_real_implementations: true

capability_status:
  values:
    - AVAILABLE
    - UNAVAILABLE
    - UNSUPPORTED
    - UNVERIFIED
    - PACKAGE_NOT_INSTALLED
    - VERSION_NOT_SUPPORTED
    - PROJECT_CONFIGURATION_REQUIRED
    - BACKEND_NOT_IMPLEMENTED
